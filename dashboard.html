<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard — BSC</title>
<style>
body{margin:0;background:#1E2D5A;font-family:"DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}
h2{color:#fff;font-size:22px}
p{color:rgba(255,255,255,.6);font-size:14px}
a{color:#B8860B;font-size:13px}
</style>
</head>
<body>
<h2>✅ Routing works!</h2>
<p id="msg">Dashboard coming soon...</p>
<a href="index.html">← Logout</a>
<script>
var auth=sessionStorage.getItem('bscAuth');
if(auth){ var u=JSON.parse(auth); document.getElementById('msg').textContent='Logged in as: '+u.name+' ('+u.role+')'; }
else{ location.href='index.html'; }
</script>
</body>
</html>
