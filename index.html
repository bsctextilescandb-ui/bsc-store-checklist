<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Store Operation Checklist — BSC</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#1E2D5A;--navy-l:#EEF1FB;--gold:#B8860B;--gold-l:#FFF8E7;
  --crimson:#C0392B;--crimson-l:#FFECEC;
  --green:#1E7A1E;--green-l:#D1FAE5;
  --orange:#D97706;--orange-l:#FEF3C7;
  --ink:#1A1A2E;--ink-60:rgba(26,26,46,.6);--ink-30:rgba(26,26,46,.3);--ink-10:rgba(26,26,46,.06);
  --ivory:#F9F7F0;--white:#fff;--border:#E8E4D8;
  --r:12px;--r-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--navy);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;outline:0;-webkit-tap-highlight-color:transparent}
input,textarea{font-family:inherit;outline:0}

/* ── PAGES ──────────────────────────────────────────────────── */
.page{position:fixed;top:0;left:0;right:0;bottom:0;display:none;overflow-y:auto}
.page.active{display:block}

/* ── PIN PAGE ───────────────────────────────────────────────── */
#pg-pin{background:#1C2951;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#pg-pin.active{display:flex}
.logo-icon{width:88px;height:88px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.s-name{font-family:"DM Serif Display",serif;font-size:21px;color:#fff;margin-bottom:4px;text-align:center}
.tagline{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.14em;text-transform:uppercase;margin-bottom:24px}
.app-nm{font-size:11px;font-weight:700;color:rgba(255,215,0,.85);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.pin-hint{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.dots{display:flex;gap:16px;justify-content:center;margin-bottom:28px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:transparent;transition:all .18s}
.dot.on{background:#fff;border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.4)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;margin-bottom:0}
.k{width:72px;height:72px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-size:22px;font-weight:600;border:1px solid rgba(255,255,255,.08);transition:background .12s,transform .1s;-webkit-tap-highlight-color:transparent}
.k:active{background:rgba(255,255,255,.22);transform:scale(.93)}
.k-zero{grid-column:2}
.k-del{background:rgba(192,57,43,.65);border-color:rgba(192,57,43,.3);font-size:17px;color:#ffb3a8}
.k-del:active{background:rgba(192,57,43,.9)}
.pin-msg{font-size:12px;min-height:20px;margin-top:12px;color:#ff8b7e;text-align:center}
.pin-msg.info{color:rgba(255,255,255,.55)}
.cb-mark{position:absolute;bottom:20px;display:flex;align-items:center;justify-content:center}
.cb-mark img{height:22px;width:auto;opacity:.55}

/* ── LOADING PAGE ───────────────────────────────────────────── */
#pg-load{background:var(--ivory);flex-direction:column;align-items:center;justify-content:center;gap:16px}
#pg-load.active{display:flex}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--navy);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── CHECKLIST PAGE ─────────────────────────────────────────── */
#pg-list{background:var(--ivory)}
.topbar{background:var(--navy);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-logo{height:36px;width:48px;object-fit:contain;background:rgba(255,255,255,.1);border-radius:8px;padding:4px}
.tb-title{font-family:"DM Serif Display",serif;color:#fff;font-size:15px;line-height:1.2}
.tb-sub{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px}
.tb-right{display:flex;align-items:center;gap:8px}
.rbadge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;text-transform:uppercase}
.back{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}

/* ── PROGRESS BAR ───────────────────────────────────────────── */
.prog-bar-wrap{background:var(--white);padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:90}
.prog-row{display:flex;justify-content:space-between;margin-bottom:6px}
.prog-lbl{font-size:12px;font-weight:600;color:var(--ink)}
.prog-n{font-size:12px;color:var(--ink-60)}
.pbar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.pfill{height:100%;border-radius:3px;background:var(--gold);transition:width .3s}
.pfill.c{background:var(--green)}

/* ── SECTION TABS ────────────────────────────────────────────── */
.section-tabs{background:var(--white);border-bottom:2px solid var(--border);padding:0 18px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:112px;z-index:89;scrollbar-width:none}
.section-tabs::-webkit-scrollbar{display:none}
.stab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--ink-60);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;background:transparent;border-top:0;border-left:0;border-right:0;border-radius:0;transition:color .15s,border-color .15s}
.stab.active{color:var(--navy);border-bottom-color:var(--gold)}
.stab .stab-badge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:9px;font-weight:700;margin-left:5px;background:var(--ink-10);color:var(--ink-60)}
.stab.active .stab-badge{background:var(--navy-l);color:var(--navy)}
.stab.has-pending .stab-badge{background:#FEF3C7;color:#D97706}
.stab.all-done .stab-badge{background:var(--green-l);color:var(--green)}

/* ── TASK CARDS ─────────────────────────────────────────────── */
.cl-body{padding:14px 14px 100px;max-width:640px;margin:0 auto}
.group-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-30);padding:14px 4px 6px;display:flex;align-items:center;gap:8px}
.group-label::after{content:'';flex:1;height:1px;background:var(--border)}

.tc{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1.5px solid var(--border);transition:border-color .2s,max-height .3s;overflow:hidden}
.tc.ok{border-color:var(--gold)}
.tc.fail{border-color:var(--crimson);background:#fffcfc}
.tc.done{border-color:var(--green)}

/* done card collapsed/expanded */
.tc-done-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tc-done-info{flex:1;min-width:0}
.tc-done-meta{font-size:11px;color:var(--ink-60);margin-top:3px}
.tc-done-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.tc-done-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.tc.expanded .tc-done-body{display:block}

.tc-lbl{font-size:13px;color:var(--ink);line-height:1.4;margin-bottom:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.mb{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--navy-l);color:var(--navy)}
.pb{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--orange-l);color:var(--orange)}
.updated-badge{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;background:#FEF3C7;color:#D97706}

/* controls */
.yno{display:flex;gap:8px;margin-top:10px}
.yb{flex:1;padding:11px 8px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--ivory);color:var(--ink-60);transition:all .15s}
.yb.y.on{background:var(--green-l);border-color:var(--green);color:var(--green)}
.yb.n.on{background:var(--crimson-l);border-color:var(--crimson);color:var(--crimson)}
.stars{display:flex;gap:6px;margin-top:10px}
.star{font-size:28px;cursor:pointer;color:var(--border);line-height:1}
.star.on{color:#F59E0B}
.photo-area{background:var(--navy-l);border:1.5px dashed var(--navy);border-radius:var(--r-sm);padding:14px;text-align:center;margin-top:10px}
.phbtn{padding:10px 18px;border-radius:var(--r-sm);background:var(--navy);color:#fff;font-size:13px;font-weight:600}
.ph-prev{display:none;flex-direction:column;gap:8px;margin-top:10px}
.ph-prev img{width:100%;max-height:200px;object-fit:cover;border-radius:var(--r-sm);border:1.5px solid var(--border)}
.retake{font-size:12px;font-weight:600;color:var(--navy);background:var(--navy-l);border:1.5px solid var(--navy);padding:5px 14px;border-radius:6px}
.rm,.ti{width:100%;margin-top:10px;padding:9px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:12px;color:var(--ink);background:var(--ivory);resize:none;height:52px;line-height:1.4}
.ti.tall{height:72px}

/* update reason */
.update-reason-wrap{margin-top:10px;padding:10px;background:var(--orange-l);border-radius:var(--r-sm);border:1px solid var(--orange);display:none}
.update-reason-wrap.show{display:block}
.update-reason-wrap label{font-size:11px;font-weight:600;color:var(--orange);display:block;margin-bottom:6px}
.update-reason-wrap textarea{width:100%;padding:8px 10px;border-radius:6px;border:1.5px solid var(--orange);font-size:12px;color:var(--ink);background:var(--white);resize:none;height:52px;line-height:1.4;font-family:inherit}

/* ── SUBMIT BAR ─────────────────────────────────────────────── */
.sub-wrap{position:fixed;bottom:0;left:0;right:0;padding:10px 16px 14px;background:var(--ivory);border-top:1px solid var(--border);z-index:80}
.vmsg{font-size:11px;color:var(--orange);margin-bottom:8px;padding:6px 10px;background:var(--orange-l);border-radius:6px;display:none}
.sub-wrap-btns{display:flex;gap:8px;align-items:stretch}
.draft-btn{padding:14px 16px;border-radius:var(--r);background:var(--navy-l);color:var(--navy);font-size:13px;font-weight:700;border:1.5px solid var(--navy);transition:all .2s;white-space:nowrap;flex-shrink:0}
.draft-btn.saved{background:var(--green-l);color:var(--green);border-color:var(--green)}
.draft-restored{font-size:11px;font-weight:600;color:var(--green);background:var(--green-l);padding:6px 10px;border-radius:6px;margin-bottom:8px;display:none}
.sub-btn{flex:1;padding:15px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:15px;font-weight:700;transition:opacity .2s}
.sub-btn:disabled{opacity:.45;cursor:not-allowed}

/* ── SUCCESS PAGE ───────────────────────────────────────────── */
#pg-done{background:var(--ivory);flex-direction:column;align-items:center;justify-content:center}
#pg-done.active{display:flex}
.done-body{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px;gap:12px;justify-content:center}
.done-body h2{font-family:"DM Serif Display",serif;font-size:28px;color:var(--navy)}
.done-body p{font-size:14px;color:var(--ink-60)}
.ok-btn{padding:14px 32px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:15px;font-weight:700;margin-top:12px}

/* ── TOAST ──────────────────────────────────────────────────── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:999;transition:transform .3s,opacity .3s;white-space:nowrap;pointer-events:none;max-width:90vw;text-align:center;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{background:var(--crimson)}
</style>
</head>
<body>

<!-- PIN PAGE -->
<div id="pg-pin" class="page active">
  <div class="logo-icon"><img id="bscLogo" alt="BSC"/></div>
  <div class="s-name">BSC The Textile Mall</div>
  <div class="tagline">Belagavi &middot; Since 1938</div>
  <div class="app-nm">Store Operation Checklist</div>
  <div class="pin-hint">Enter your 4-digit PIN</div>
  <div class="dots">
    <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
  </div>
  <div class="pad">
    <button class="k" onclick="kp(1)">1</button><button class="k" onclick="kp(2)">2</button><button class="k" onclick="kp(3)">3</button>
    <button class="k" onclick="kp(4)">4</button><button class="k" onclick="kp(5)">5</button><button class="k" onclick="kp(6)">6</button>
    <button class="k" onclick="kp(7)">7</button><button class="k" onclick="kp(8)">8</button><button class="k" onclick="kp(9)">9</button>
    <button class="k k-zero" onclick="kp(0)">0</button><button class="k k-del" onclick="kd()">&#9003;</button>
  </div>
  <div class="pin-msg" id="pmsg"></div>
  <div class="cb-mark"><img id="cbLogo" alt="C&B"/></div>
</div>

<!-- LOADING PAGE -->
<div id="pg-load" class="page">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--ink-60)">Loading checklist...</div>
</div>

<!-- CHECKLIST PAGE -->
<div id="pg-list" class="page">
  <div class="topbar">
    <div class="tb-left">
      <img class="tb-logo" id="topbarLogo" alt="BSC"/>
      <div>
        <div class="tb-title">Store Operation Checklist</div>
        <div class="tb-sub" id="cl-sub">-</div>
      </div>
    </div>
    <div class="tb-right">
      <div class="rbadge" id="cl-role">-</div>
      <button class="back" onclick="goHome()">&#8617;</button>
    </div>
  </div>
  <div class="prog-bar-wrap">
    <div class="prog-row"><span class="prog-lbl">Progress</span><span class="prog-n" id="pn">0 / 0</span></div>
    <div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
  </div>
  <div class="section-tabs" id="sec-tabs"></div>
  <div class="cl-body" id="cl-body"></div>
  <div class="sub-wrap">
    <div class="draft-restored" id="draftBanner"></div>
    <div class="vmsg" id="vmsg"></div>
    <div class="sub-wrap-btns">
      <button class="draft-btn" id="draftBtn" onclick="saveDraft()">&#128190; Save Draft</button>
      <button class="sub-btn" id="sub-btn" onclick="doSubmit()" disabled>Submit</button>
    </div>
  </div>
</div>

<!-- SUCCESS PAGE -->
<div id="pg-done" class="page">
  <div class="done-body">
    <div style="font-size:64px">&#9989;</div>
    <h2>Submitted!</h2>
    <p id="done-msg">Checklist submitted.</p>
    <p id="done-time" style="font-size:12px;color:var(--ink-30)"></p>
    <button class="ok-btn" onclick="goHome()">&#8592; Back to Home</button>
  </div>
</div>

<div id="toast"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbzT-GnqHn6EfZnNMl2JdqwTfaOoKLklHe0PN4CSynq-c2nZWa1t43_8vNyvCrkpHqSyhQ/exec';
var RAW_BSC = 'https://bsctextilescandb-ui.github.io/retail-crm/logo.jpg';
var RAW_CB  = 'https://bsctextilescandb-ui.github.io/retail-crm/cnb-logo.png';

var pin='', me=null, secs=[], ans={}, must=[], pics=[], tot=0;
var curSecIdx=0;

// ── logo setup ────────────────────────────────────────────────
(function(){
  var el=document.getElementById('bscLogo'); if(el) el.src=RAW_BSC;
  var tl=document.getElementById('topbarLogo'); if(tl) tl.src=RAW_BSC;
  stripBlack(RAW_CB,40,function(c){
    var el=document.getElementById('cbLogo'); if(el) el.src=c;
  });
})();

function stripBlack(src,thresh,cb){
  var img=new Image(); img.crossOrigin='anonymous';
  img.onload=function(){
    var c=document.createElement('canvas');
    c.width=img.width; c.height=img.height;
    var ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
    var d=ctx.getImageData(0,0,c.width,c.height), px=d.data;
    for(var i=0;i<px.length;i+=4){
      if(px[i]<thresh&&px[i+1]<thresh&&px[i+2]<thresh) px[i+3]=0;
    }
    ctx.putImageData(d,0,0); cb(c.toDataURL('image/png'));
  };
  img.onerror=function(){ cb(src); };
  img.src=src;
}

// ── PIN ───────────────────────────────────────────────────────
function dots(){
  for(var i=0;i<4;i++){
    var el=document.getElementById('d'+i);
    if(i<pin.length) el.classList.add('on'); else el.classList.remove('on');
  }
}
function kp(n){
  if(pin.length>=4) return;
  pin=pin+String(n); dots();
  if(pin.length===4) setTimeout(validatePin,200);
}
function kd(){
  if(!pin.length) return;
  pin=pin.slice(0,-1); dots(); setMsg('','');
}
function setMsg(txt,type){
  var el=document.getElementById('pmsg');
  el.textContent=txt; el.className='pin-msg'+(type?' '+type:'');
}

// ── Pages ─────────────────────────────────────────────────────
function goPage(id){
  ['pg-pin','pg-load','pg-list','pg-done'].forEach(function(p){
    var el=document.getElementById(p);
    if(!el) return;
    if(p===id){ el.classList.add('active'); el.style.display=''; }
    else { el.classList.remove('active'); el.style.display='none'; }
  });
  if(id!=='pg-pin') window.scrollTo(0,0);
}

function goHome(){
  pin=''; me=null; ans={}; secs=[]; must=[]; pics=[]; tot=0; curSecIdx=0;
  dots(); setMsg('','');
  document.getElementById('cl-body').innerHTML='';
  document.getElementById('sec-tabs').innerHTML='';
  var pf=document.getElementById('pf'); if(pf){ pf.style.width='0%'; pf.className='pfill'; }
  document.getElementById('pn').textContent='0 / 0';
  goPage('pg-pin');
}

// ── API ───────────────────────────────────────────────────────
function apiGet(action,params,cb){
  var q='action='+encodeURIComponent(action);
  if(params){ Object.keys(params).forEach(function(k){ q+='&'+encodeURIComponent(k)+'='+encodeURIComponent(String(params[k])); }); }
  fetch(API+'?'+q,{redirect:'follow'})
    .then(function(r){return r.text();})
    .then(function(txt){
      try{ cb(JSON.parse(txt)); }
      catch(e){ cb({ok:false,error:'Bad response'}); }
    })
    .catch(function(e){ cb({ok:false,error:'Network error: '+e.message}); });
}

function apiPost(data,cb){
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data),redirect:'follow'})
    .then(function(r){return r.text();})
    .then(function(txt){
      try{ cb(JSON.parse(txt)); }
      catch(e){ cb({ok:false,error:'Server error'}); }
    })
    .catch(function(){
      // GET fallback (no photos)
      var fd={action:data.action,staffName:data.staffName||'',role:data.role||''};
      var ents=(data.entries||[]).map(function(e){
        return {section:e.section,taskId:e.taskId,taskName:e.taskName,type:e.type,
                response:e.response||'',photoUrl:'',status:e.status||'OK',remarks:e.remarks||'',
                sequence:e.sequence||'First',updateReason:e.updateReason||''};
      });
      fd.entries=JSON.stringify(ents);
      var q=Object.keys(fd).map(function(k){return k+'='+encodeURIComponent(String(fd[k]));}).join('&');
      fetch(API+'?'+q,{redirect:'follow'})
        .then(function(r){return r.text();})
        .then(function(t){ try{cb(JSON.parse(t));}catch(e){cb({ok:false,error:'Submit failed'});} })
        .catch(function(){cb({ok:false,error:'No connection'});});
    });
}

function compress(file,cb){
  var rd=new FileReader();
  rd.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'),w=img.width,h=img.height,m=600;
      if(w>m){h=Math.round(h*m/w);w=m;}
      c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.6));
    };
    img.src=e.target.result;
  };
  rd.readAsDataURL(file);
}

function ist(){
  var d=new Date(new Date().getTime()+19800000);
  var dy=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var p=function(x){return ('0'+x).slice(-2);};
  return {
    lbl:dy[d.getUTCDay()]+' '+d.getUTCDate()+' '+mo[d.getUTCMonth()]+' '+d.getUTCFullYear(),
    t:p(d.getUTCHours())+':'+p(d.getUTCMinutes()),
    str:d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())
  };
}

function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className=(type==='err')?'err show':'show';
  clearTimeout(t._t); t._t=setTimeout(function(){t.className='';},3500);
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── VALIDATE PIN ──────────────────────────────────────────────
function validatePin(){
  setMsg('Checking...','info');
  apiGet('validatePin',{pin:pin},function(r){
    if(!r.ok){ setMsg(r.error||'Invalid PIN','err'); pin=''; dots(); return; }
    me={name:r.name,role:r.role,isAdmin:r.isAdmin||false};
    if(r.role==='Owner'){
      sessionStorage.setItem('cbAuth',JSON.stringify(me));
      location.href='dashboard.html'; return;
    }
    goPage('pg-load');
    loadChecklist(r.role);
  });
}

// ── LOAD CHECKLIST ────────────────────────────────────────────
function loadChecklist(role){
  var tmr=setTimeout(function(){
    toast('Checklist taking too long. Check deployment.','err'); goPage('pg-pin');
  },15000);
  apiGet('getChecklist',{role:role},function(r){
    clearTimeout(tmr);
    if(!r.ok||!r.sections){ toast(r.error||'Could not load checklist.','err'); goPage('pg-pin'); return; }
    try{
      secs=r.sections; ans={}; must=[]; pics=[]; tot=0;
      secs.forEach(function(s){
        s.tasks.forEach(function(t){
          tot++;
          if(t.mandatory) must.push(t.taskId);
          if(t.photoRequired) pics.push(t.taskId);
          // pre-fill ans for already-submitted tasks
          if(t.submitted&&t.submittedStatus){
            var ss=t.submittedStatus;
            ans[t.taskId]={v:ss.response,s:ss.status,r:ss.remarks,p:ss.photoUrl,_done:true,_byMe:ss.submittedByMe};
          }
        });
      });
      var dt=ist();
      document.getElementById('cl-sub').textContent=dt.lbl+' \u00B7 '+me.name;
      document.getElementById('cl-role').textContent=me.role;
      buildChecklist();
      var draft=loadDraft();
      if(draft){ restoreDraft(draft); }
      goPage('pg-list');
    }catch(err){ toast('Error building checklist: '+err.message,'err'); goPage('pg-pin'); }
  });
}

// ── BUILD CHECKLIST ───────────────────────────────────────────
function buildChecklist(){
  // Build section tabs
  var tabsEl=document.getElementById('sec-tabs');
  tabsEl.innerHTML='';
  secs.forEach(function(s,i){
    var pending=s.tasks.filter(function(t){return !t.submitted;}).length;
    var btn=document.createElement('button');
    btn.className='stab'+(i===0?' active':'')+(pending===0?' all-done':' has-pending');
    btn.setAttribute('data-idx',i);
    btn.innerHTML=esc(s.section)+'<span class="stab-badge">'+pending+'</span>';
    btn.onclick=function(){ scrollToSection(i); };
    tabsEl.appendChild(btn);
  });

  // Build body
  var body=document.getElementById('cl-body');
  body.innerHTML='';
  secs.forEach(function(s,si){
    var secDiv=document.createElement('div');
    secDiv.id='sec-'+si;
    secDiv.className='sec-group';

    var lbl=document.createElement('div');
    lbl.className='group-label';
    lbl.textContent=(si+1)+'. '+s.section;
    secDiv.appendChild(lbl);

    s.tasks.forEach(function(t){
      secDiv.appendChild(buildCard(t,s.section,si));
    });
    body.appendChild(secDiv);
  });

  updateProg();
  setupScrollObserver();
}

function buildCard(t,section,si){
  var id=t.taskId;
  var isDone=t.submitted&&t.submittedStatus;
  var div=document.createElement('div');

  if(isDone){
    // DONE CARD — collapsed, tappable to expand/edit
    var ss=t.submittedStatus;
    var statusIcon=ss.status==='FAIL'?'❌':'✅';
    var byText='Done by '+esc(ss.staffName)+' · '+esc(ss.timestamp.slice(11,16));
    if(ss.totalEntries>1) byText+=' · Updated';

    div.className='tc done';
    div.id='tc_'+id;
    div.innerHTML=
      '<div class="tc-done-header" onclick="toggleDoneCard(\''+id+'\')">'
      +'<div class="tc-done-info">'
        +'<div class="tc-lbl">'+esc(t.taskName)
          +(t.mandatory?'<span class="mb">Mandatory</span>':'')
          +(t.photoRequired?'<span class="pb">Photo</span>':'')
          +(ss.totalEntries>1?'<span class="updated-badge">Updated</span>':'')
        +'</div>'
        +'<div class="tc-done-meta">'+statusIcon+' '+byText+'</div>'
      +'</div>'
      +'<div class="tc-done-icon">&#8964;</div>'
      +'</div>'
      +'<div class="tc-done-body" id="tcdb_'+id+'">'
        +buildEditControls(t,ss)
      +'</div>';
  } else {
    // PENDING CARD
    div.className='tc';
    div.id='tc_'+id;
    var mb=t.mandatory?'<span class="mb">Mandatory</span>':'';
    var pb=t.photoRequired?'<span class="pb">Photo</span>':'';
    div.innerHTML='<div class="tc-lbl">'+esc(t.taskName)+' '+mb+pb+'</div>'
      +buildPendingControls(t,section,si);
  }
  return div;
}

function buildPendingControls(t,section,si){
  var id=t.taskId;
  var html='';
  if(t.type==='yesno'){
    html='<div class="yno">'
      +'<button class="yb y" id="y_'+id+'" data-id="'+id+'" data-sec="'+esc(section)+'" onclick="ynBtn(this)">&#10003; Yes</button>'
      +'<button class="yb n" id="n_'+id+'" data-id="'+id+'" data-sec="'+esc(section)+'" onclick="ynBtn(this)">&#10007; No</button>'
      +'</div>'
      +'<div id="rd_'+id+'" style="display:none"><textarea class="rm" data-id="'+id+'" placeholder="Describe issue..." oninput="remTA(this)"></textarea></div>';
    if(t.photoRequired) html+=extraPhoto(id);
  } else if(t.type==='rating'){
    html='<div class="stars" id="st_'+id+'">'
      +[1,2,3,4,5].map(function(n){return '<span class="star" data-id="'+id+'" data-n="'+n+'" data-sec="'+esc(section)+'" onclick="starBtn(this)">&#9733;</span>';}).join('')
      +'</div>'
      +'<div id="rd_'+id+'" style="display:none"><textarea class="rm" data-id="'+id+'" placeholder="Remarks..." oninput="remTA(this)"></textarea></div>';
    if(t.photoRequired) html+=extraPhoto(id);
  } else if(t.type==='photo'){
    html='<div style="margin-top:10px">'
      +'<input type="file" accept="image/*" capture="environment" id="fi_'+id+'" style="display:none" data-id="'+id+'" data-sec="'+esc(section)+'" onchange="phFile(this)"/>'
      +'<div class="photo-area" id="pa_'+id+'"><button class="phbtn" data-target="fi_'+id+'" onclick="trigFile(this)">&#128247; Take / Upload Photo</button></div>'
      +'<div class="ph-prev" id="pp_'+id+'"><img id="pi_'+id+'" alt=""/><button class="retake" data-id="'+id+'" onclick="rp(\''+id+'\')">Retake</button></div>'
      +'<textarea class="rm" data-id="'+id+'" placeholder="Photo remarks..." oninput="remTA(this)"></textarea>'
      +'</div>';
  } else {
    html='<textarea class="ti" id="tx_'+id+'" data-id="'+id+'" data-sec="'+esc(section)+'" style="margin-top:10px" placeholder="Enter response..." oninput="txtTA(this)"></textarea>';
    if(t.photoRequired) html+=extraPhoto(id);
  }
  return html;
}

// ── CARD INTERACTIONS ─────────────────────────────────────────
function toggleDoneCard(id){
  var card=document.getElementById('tc_'+id);
  card.classList.toggle('expanded');
  var icon=card.querySelector('.tc-done-icon');
  if(icon) icon.textContent=card.classList.contains('expanded')?'▲':'⌄';
}

function ynBtn(btn){
  var id=btn.getAttribute('data-id');
  var v=btn.getAttribute('data-v')||btn.textContent.trim().toLowerCase().includes('yes')?'yes':'no';
  // detect from button id
  var isY=btn.id.startsWith('y_')||btn.id.startsWith('ey_');
  v=isY?'yes':'no';
  var isEdit=btn.getAttribute('data-edit')==='1';
  var pfx=isEdit?'e':'';
  if(!ans[id]) ans[id]={};
  ans[id].v=v; ans[id].s=(v==='yes')?'OK':'FAIL';
  var yEl=document.getElementById(pfx+'y_'+id);
  var nEl=document.getElementById(pfx+'n_'+id);
  if(yEl) yEl.className='yb y'+(v==='yes'?' on':'');
  if(nEl) nEl.className='yb n'+(v==='no'?' on':'');
  var rd=document.getElementById(pfx+'rd_'+id);
  if(rd) rd.style.display=(v==='no')?'block':'none';
  if(!isEdit){
    var card=document.getElementById('tc_'+id);
    if(card) card.className='tc '+(v==='no'?'fail':'ok');
    var sec=btn.getAttribute('data-sec')||'';
    ans[id].sec=sec;
  } else {
    // show update reason
    var urw=document.getElementById('urw_'+id);
    if(urw) urw.classList.add('show');
  }
  updateProg();
}

function starBtn(btn){
  var id=btn.getAttribute('data-id');
  var n=parseInt(btn.getAttribute('data-n'),10);
  var isEdit=btn.getAttribute('data-edit')==='1';
  var pfx=isEdit?'e':'';
  if(!ans[id]) ans[id]={};
  ans[id].v=String(n); ans[id].s=(n>=3)?'OK':'FAIL';
  var stEl=document.getElementById(pfx+'st_'+id);
  if(stEl){ stEl.querySelectorAll('.star').forEach(function(s,k){ s.className='star'+(k<n?' on':''); }); }
  if(!isEdit){
    var card=document.getElementById('tc_'+id);
    if(card) card.className='tc '+(n<3?'fail':'ok');
    var rd=document.getElementById('rd_'+id); if(rd) rd.style.display='block';
    var sec=btn.getAttribute('data-sec')||'';
    ans[id].sec=sec;
  } else {
    var urw=document.getElementById('urw_'+id); if(urw) urw.classList.add('show');
  }
  updateProg();
}

function remTA(ta){
  var id=ta.getAttribute('data-id');
  if(!ans[id]) ans[id]={};
  ans[id].r=ta.value;
}

function txtTA(ta){
  var id=ta.getAttribute('data-id');
  var isEdit=ta.getAttribute('data-edit')==='1';
  if(!ans[id]) ans[id]={};
  ans[id].v=ta.value.trim(); ans[id].s=ta.value.trim()?'OK':'FAIL';
  if(!isEdit){
    var card=document.getElementById('tc_'+id);
    if(card) card.className='tc'+(ta.value.trim()?' ok':'');
    var sec=ta.getAttribute('data-sec')||'';
    ans[id].sec=sec;
  } else {
    var urw=document.getElementById('urw_'+id); if(urw) urw.classList.add('show');
  }
  updateProg();
}

function urTA(id){ /* just triggers updateProg */ updateProg(); }

function trigFile(btn){
  var inp=document.getElementById(btn.getAttribute('data-target')); if(inp) inp.click();
}

function phFile(inp){
  var id=inp.getAttribute('data-id');
  var extra=inp.getAttribute('data-extra')==='1';
  var isEdit=inp.getAttribute('data-edit')==='1';
  if(!inp.files||!inp.files[0]) return;
  var pfx=isEdit?'e':'';
  var xsfx=extra?id+'x':id;
  compress(inp.files[0],function(b){
    if(!ans[id]) ans[id]={};
    if(extra){ ans[id].p=b; } else { ans[id].v='Photo'; ans[id].s='OK'; ans[id].p=b; }
    var paEl=document.getElementById(pfx+'pa_'+xsfx);
    var ppEl=document.getElementById(pfx+'pp_'+xsfx);
    var piEl=document.getElementById(pfx+'pi_'+xsfx);
    if(paEl) paEl.style.display='none';
    if(piEl) piEl.src=b;
    if(ppEl) ppEl.style.display='flex';
    if(!isEdit){
      var card=document.getElementById('tc_'+id);
      if(card) card.className='tc ok';
    } else {
      var urw=document.getElementById('urw_'+id); if(urw) urw.classList.add('show');
    }
    updateProg();
  });
}

function rp(id){
  if(ans[id]){ delete ans[id].v; delete ans[id].p; }
  var card=document.getElementById('tc_'+id); if(card) card.className='tc';
  var pa=document.getElementById('pa_'+id); if(pa) pa.style.display='';
  var pp=document.getElementById('pp_'+id); if(pp) pp.style.display='none';
  var fi=document.getElementById('fi_'+id); if(fi) fi.value='';
  updateProg();
}

function rpx(id){
  var x=id+'x';
  if(ans[id]) delete ans[id].p;
  var pa=document.getElementById('pa_'+x); if(pa) pa.style.display='';
  var pp=document.getElementById('pp_'+x); if(pp) pp.style.display='none';
  var fi=document.getElementById('fi_'+x); if(fi) fi.value='';
  updateProg();
}

function rpEdit(id){
  var pa=document.getElementById('epa_'+id); if(pa) pa.style.display='';
  var pp=document.getElementById('epp_'+id); if(pp) pp.style.display='none';
  var fi=document.getElementById('efi_'+id); if(fi) fi.value='';
  if(ans[id]) delete ans[id].p;
}

function saveEdit(id){
  var urEl=document.getElementById('ur_'+id);
  var reason=urEl?urEl.value.trim():'';
  if(!reason){ toast('Please enter reason for update','err'); return; }
  var a=ans[id]||{};
  if(!a.v){ toast('Please fill in a response first','err'); return; }

  // find task
  var task=null, section='';
  secs.forEach(function(s){ s.tasks.forEach(function(t){ if(t.taskId===id){ task=t; section=s.section; } }); });
  if(!task) return;

  var btn=document.getElementById('esave_'+id);
  btn.disabled=true; btn.textContent='Saving...';

  var entry={
    section:section, taskId:id, taskName:task.taskName, type:task.type,
    response:a.v, photoBase64:a.p||'', photoUrl:'',
    status:a.s||'OK', remarks:a.r||'',
    sequence:'Update', updateReason:reason
  };

  apiPost({action:'submitChecklist',staffName:me.name,role:me.role,entries:[entry]},function(r){
    if(r.ok){
      toast('Updated ✓');
      // collapse card and refresh display
      var card=document.getElementById('tc_'+id);
      if(card){
        card.className='tc done';
        card.classList.remove('expanded');
        var meta=card.querySelector('.tc-done-meta');
        if(meta) meta.textContent='✅ Updated by '+me.name+' · now';
        var badge=card.querySelector('.updated-badge');
        if(!badge){
          var lbl=card.querySelector('.tc-lbl');
          if(lbl){ var sp=document.createElement('span'); sp.className='updated-badge'; sp.textContent='Updated'; lbl.appendChild(sp); }
        }
      }
    } else {
      toast(r.error||'Update failed','err');
      btn.disabled=false; btn.textContent='Save Update';
    }
  });
}

// ── PROGRESS ──────────────────────────────────────────────────
function updateProg(){
  var done=0;
  Object.keys(ans).forEach(function(k){ if(ans[k].v||ans[k]._done) done++; });
  document.getElementById('pn').textContent=done+' / '+tot;
  var pct=tot>0?Math.round((done/tot)*100):0;
  var pf=document.getElementById('pf');
  pf.style.width=pct+'%';
  pf.className='pfill'+(pct>=100?' c':'');

  // check all mandatory + photo required answered
  var allOk=true;
  must.forEach(function(mid){
    if(!ans[mid]||(!ans[mid].v&&!ans[mid]._done)) allOk=false;
  });
  pics.forEach(function(pid){
    if(!ans[pid]||(!ans[pid].p&&!ans[pid]._done)) allOk=false;
  });
  document.getElementById('sub-btn').disabled=!allOk;

  // update section tab badges
  var tabs=document.querySelectorAll('.stab');
  secs.forEach(function(s,i){
    var pending=s.tasks.filter(function(t){
      var a=ans[t.taskId];
      return !(a&&(a.v||a._done));
    }).length;
    if(tabs[i]){
      var badge=tabs[i].querySelector('.stab-badge');
      if(badge) badge.textContent=pending;
      tabs[i].classList.remove('all-done','has-pending');
      tabs[i].classList.add(pending===0?'all-done':'has-pending');
    }
  });

  // missing mandatory hint
  var miss=[];
  must.forEach(function(mid){
    if(!ans[mid]||(!ans[mid].v&&!ans[mid]._done)){
      secs.forEach(function(s){ s.tasks.forEach(function(t){ if(t.taskId===mid) miss.push(t.taskName.slice(0,30)+'...'); }); });
    }
  });
  var vm=document.getElementById('vmsg');
  if(miss.length>0&&done>0){
    vm.textContent='Pending: '+miss.slice(0,2).join(', ')+(miss.length>2?' +'+( miss.length-2)+' more':'');
    vm.style.display='block';
  } else vm.style.display='none';
}

// ── SECTION TAB SCROLL ────────────────────────────────────────
function scrollToSection(idx){
  curSecIdx=idx;
  var el=document.getElementById('sec-'+idx);
  if(el){
    var offset=el.getBoundingClientRect().top+window.scrollY-190;
    window.scrollTo({top:offset,behavior:'smooth'});
  }
  updateActivetab(idx);
}

function updateActivetab(idx){
  document.querySelectorAll('.stab').forEach(function(t,i){
    t.classList.toggle('active',i===idx);
  });
}

function setupScrollObserver(){
  if(!window.IntersectionObserver) return;
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        var id=entry.target.id;
        var idx=parseInt(id.replace('sec-',''),10);
        if(!isNaN(idx)) updateActivetab(idx);
      }
    });
  },{rootMargin:'-160px 0px -60% 0px',threshold:0});
  secs.forEach(function(s,i){
    var el=document.getElementById('sec-'+i); if(el) obs.observe(el);
  });
}

// ── SUBMIT ────────────────────────────────────────────────────
function doSubmit(){
  var btn=document.getElementById('sub-btn');
  btn.disabled=true; btn.textContent='Submitting...';
  var entries=[];
  secs.forEach(function(s){
    s.tasks.forEach(function(t){
      var a=ans[t.taskId]||{};
      // only submit if not previously done OR has new value
      if(!a._done||a.v){
        entries.push({
          section:s.section, taskId:t.taskId, taskName:t.taskName, type:t.type,
          response:a.v||'', photoBase64:a.p||'', photoUrl:'',
          status:a.s||(a.v?'OK':'MISS'), remarks:a.r||'',
          sequence:'First', updateReason:''
        });
      }
    });
  });
  if(!entries.length){ toast('Nothing new to submit','err'); btn.disabled=false; btn.textContent='Submit'; return; }
  apiPost({action:'submitChecklist',staffName:me.name,role:me.role,entries:entries},function(r){
    if(r.ok){
      var dt=ist();
      document.getElementById('done-msg').textContent=me.name+' — '+me.role+' submitted.';
      document.getElementById('done-time').textContent=dt.lbl+' at '+dt.t+' IST';
      clearDraft(); goPage('pg-done');
      setTimeout(goHome,3000);
    } else {
      toast(r.error||'Submission failed','err');
      btn.disabled=false; btn.textContent='Submit';
    }
  });
}

// ── DRAFT ─────────────────────────────────────────────────────
function draftKey(){
  if(!me) return null;
  var d=ist().str;
  return 'soc_'+me.role+'_'+me.name.replace(/\W+/g,'_')+'_'+d;
}

function saveDraft(){
  try{
    var key=draftKey(); if(!key) return;
    var draft={staffName:me.name,role:me.role,date:ist().str,savedAt:ist().t,answers:ans};
    localStorage.setItem(key,JSON.stringify(draft));
    var btn=document.getElementById('draftBtn');
    btn.textContent='\u2713 Saved'; btn.classList.add('saved');
    setTimeout(function(){ btn.textContent='\u{1F4BE} Save Draft'; btn.classList.remove('saved'); },2000);
    toast('Draft saved at '+ist().t);
  }catch(e){ toast('Draft save failed','err'); }
}

function loadDraft(){
  try{
    var key=draftKey(); if(!key) return null;
    var raw=localStorage.getItem(key); if(!raw) return null;
    var d=JSON.parse(raw);
    if(!d||d.role!==me.role||d.date!==ist().str){ localStorage.removeItem(key); return null; }
    return d;
  }catch(e){ return null; }
}

function restoreDraft(draft){
  ans=draft.answers||{};
  var banner=document.getElementById('draftBanner');
  if(banner){ banner.textContent='\u21BA Draft restored from '+draft.savedAt+' — continue where you left off'; banner.style.display='block'; }
  updateProg();
}

function clearDraft(){
  try{ var key=draftKey(); if(key) localStorage.removeItem(key); }catch(e){}
}
</script>
