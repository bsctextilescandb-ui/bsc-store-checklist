<div id="toast"></div>
<script src="script.js"></script>
<script>
var currentUser      = null;
var pinBuffer        = '';
var sections         = [];
var answers          = {};
var mandatoryIds     = [];
var photoRequiredIds = [];
var totalTasks       = 0;

/* ── PIN ────────────────────────────────────────────── */
function pinPress(d) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += d;
  renderDots();
  if (pinBuffer.length === 4) setTimeout(doValidatePin, 150);
}
function pinDel() {
  pinBuffer = pinBuffer.slice(0,-1);
  renderDots();
  document.getElementById('pinError').textContent = '';
}
function renderDots() {
  document.querySelectorAll('.pin-dot').forEach(function(dot, i) {
    dot.classList.toggle('filled', i < pinBuffer.length);
  });
}
function showPinError(msg, isErr) {
  var el = document.getElementById('pinError');
  el.textContent = msg;
  el.style.color = isErr===false ? 'var(--ink-60)' : 'var(--crimson)';
}

async function doValidatePin() {
  showPinError('Checking...', false);
  var res = await api('validatePin', { pin: pinBuffer });
  if (!res.ok) {
    showPinError(res.error || 'Invalid PIN. Please try again.');
    pinBuffer = ''; renderDots(); return;
  }
  currentUser = { name: res.name, role: res.role };
  if (res.role === 'Owner') {
    sessionStorage.setItem('cbAuth', JSON.stringify(currentUser));
    window.location.href = 'dashboard.html';
    return;
  }
  showScreen('loadingScreen');
  await loadChecklist(res.role);
}

/* ── CHECKLIST ──────────────────────────────────────── */
async function loadChecklist(role) {
  var res = await api('getChecklist', { role: role });
  if (!res.ok || !res.sections) {
    showToast(res.error || 'Failed to load checklist.', 'error');
    showScreen('pinScreen'); return;
  }
  sections = res.sections; answers = {};
  mandatoryIds = []; photoRequiredIds = []; totalTasks = 0;
  sections.forEach(function(sec) {
    sec.tasks.forEach(function(t) {
      totalTasks++;
      if (t.mandatory)     mandatoryIds.push(t.taskId);
      if (t.photoRequired) photoRequiredIds.push(t.taskId);
    });
  });
  mandatoryIds.push('__wrongToday__');
  renderChecklist();
  var dt = getISTDate();
  document.getElementById('clDateSub').textContent   = dt.label + ' · ' + currentUser.name;
  document.getElementById('clRoleBadge').textContent = currentUser.role;
  showScreen('checklistScreen');
}

function renderChecklist() {
  var body = document.getElementById('checklistBody');
  var html = '';
  sections.forEach(function(sec, si) {
    html += '<div class="section-block"><div class="section-header"><div class="section-num">' + (si+1) + '</div><div class="section-name">' + esc(sec.section) + '</div></div><div class="section-divider"></div>';
    sec.tasks.forEach(function(t) { html += buildTaskHtml(t); });
    html += '</div>';
  });
  html += '<div class="section-block"><div class="section-header"><div class="section-num" style="background:var(--crimson)">!</div><div class="section-name">Daily Report</div></div><div class="section-divider"></div><div class="wrong-today-card" id="pc___wrongToday__"><div class="point-label">What went wrong today? <span class="mandatory-badge">Mandatory</span></div><div style="font-size:11px;color:var(--ink-30);margin:4px 0 8px">Describe any issues, incidents, or suggestions</div><textarea class="text-input full" id="wrongTodayInput" placeholder="e.g. AC off in section B..." oninput="setWrongToday(this.value)"></textarea></div></div><div style="height:24px"></div>';
  body.innerHTML = html;
  updateProgress();
}

function buildTaskHtml(task) {
  var mb = task.mandatory     ? '<span class="mandatory-badge">Mandatory</span>' : '';
  var pb = task.photoRequired ? '<span class="photo-badge">Photo Req</span>'     : '';
  var ctrl = '';
  var tid  = task.taskId;

  if (task.type === 'yesno') {
    ctrl = '<div class="point-controls" style="margin-top:10px">' +
      '<button class="yn-btn yes" id="yes_'+tid+'" onclick="setYN(''+tid+'','yes')">Yes</button>' +
      '<button class="yn-btn no"  id="no_'+tid+'"  onclick="setYN(''+tid+'','no')">No</button></div>' +
      '<div id="rem_'+tid+'" style="display:none"><textarea class="remarks-input" placeholder="Describe the issue..." oninput="setRemarks(''+tid+'',this.value)"></textarea></div>' +
      (task.photoRequired ? xPhoto(tid) : '');

  } else if (task.type === 'rating') {
    ctrl = '<div class="star-rating" id="stars_'+tid+'" style="margin-top:10px">' +
      [1,2,3,4,5].map(function(n){ return '<span class="star" onclick="setRating(''+tid+'','+n+')">&#9733;</span>'; }).join('') + '</div>' +
      '<div id="rem_'+tid+'" style="display:none"><textarea class="remarks-input" placeholder="Rating remarks..." oninput="setRemarks(''+tid+'',this.value)"></textarea></div>' +
      (task.photoRequired ? xPhoto(tid) : '');

  } else if (task.type === 'photo') {
    ctrl = '<div style="margin-top:10px">' +
      '<input type="file" accept="image/*" capture="environment" id="file_'+tid+'" style="display:none" onchange="handlePhoto(''+tid+'',this)"/>' +
      '<div class="photo-upload-area" id="photoArea_'+tid+'"><button class="photo-btn" onclick="document.getElementById('file_'+tid+'').click()">Take / Upload Photo</button></div>' +
      '<div class="photo-preview" id="photoPreview_'+tid+'" style="display:none"><img id="previewImg_'+tid+'" class="preview-img" alt="Preview"/><button class="retake-btn" onclick="retakePhoto(''+tid+'')">Retake</button></div>' +
      '<textarea class="remarks-input" placeholder="Photo remarks..." oninput="setRemarks(''+tid+'',this.value)"></textarea></div>';

  } else if (task.type === 'text') {
    ctrl = '<textarea class="text-input" id="textInput_'+tid+'" style="margin-top:10px" placeholder="Enter your response..." oninput="setText(''+tid+'',this.value)"></textarea>' +
      (task.photoRequired ? xPhoto(tid) : '');
  }
  return '<div class="point-card" id="pc_'+tid+'"><div class="point-label">'+esc(task.taskName)+' '+mb+pb+'</div>'+ctrl+'</div>';
}

function xPhoto(taskId) {
  var xid = taskId+'_xph';
  return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"><div style="font-size:11px;font-weight:600;color:var(--orange);margin-bottom:6px">Photo required</div>' +
    '<input type="file" accept="image/*" capture="environment" id="file_'+xid+'" style="display:none" onchange="handlePhotoExtra(''+taskId+'',this)"/>' +
    '<div class="photo-upload-area" id="photoArea_'+xid+'" style="padding:10px"><button class="photo-btn small" onclick="document.getElementById('file_'+xid+'').click()">Take Photo</button></div>' +
    '<div class="photo-preview" id="photoPreview_'+xid+'" style="display:none"><img id="previewImg_'+xid+'" class="preview-img" style="max-height:120px" alt="Preview"/><button class="retake-btn" onclick="retakePhotoExtra(''+taskId+'')">Retake</button></div></div>';
}

/* ── SETTERS ──────────────────────────────────────────── */
function setYN(tid, val) {
  answers[tid] = Object.assign(answers[tid]||{}, {value:val, status:val==='yes'?'OK':'FAIL'});
  document.getElementById('pc_'+tid).classList.add('answered');
  document.getElementById('pc_'+tid).classList.toggle('failed', val==='no');
  document.getElementById('yes_'+tid).classList.toggle('active', val==='yes');
  document.getElementById('no_'+tid).classList.toggle('active',  val==='no');
  var rem=document.getElementById('rem_'+tid); if(rem) rem.style.display=val==='no'?'block':'none';
  updateProgress();
}
function setRating(tid, val) {
  answers[tid] = Object.assign(answers[tid]||{}, {value:String(val), status:val>=3?'OK':'FAIL'});
  document.getElementById('stars_'+tid).querySelectorAll('.star').forEach(function(s,i){ s.classList.toggle('active',i<val); });
  document.getElementById('pc_'+tid).classList.add('answered');
  document.getElementById('pc_'+tid).classList.toggle('failed', val<3);
  var rem=document.getElementById('rem_'+tid); if(rem) rem.style.display='block';
  updateProgress();
}
function setText(tid, val) {
  answers[tid] = Object.assign(answers[tid]||{}, {value:val.trim(), status:val.trim()?'OK':'FAIL'});
  if(val.trim()){ document.getElementById('pc_'+tid).classList.add('answered'); document.getElementById('pc_'+tid).classList.remove('failed'); }
  else document.getElementById('pc_'+tid).classList.remove('answered');
  updateProgress();
}
function setRemarks(tid, val) { answers[tid]=Object.assign(answers[tid]||{},{remarks:val}); }
async function handlePhoto(tid, input) {
  if(!input.files||!input.files[0]) return;
  var b64=await compressImage(input.files[0]);
  answers[tid]=Object.assign(answers[tid]||{},{value:'Photo taken',status:'OK',photoBase64:b64});
  document.getElementById('pc_'+tid).classList.add('answered');
  document.getElementById('photoArea_'+tid).style.display='none';
  document.getElementById('previewImg_'+tid).src=b64;
  document.getElementById('photoPreview_'+tid).style.display='flex';
  updateProgress();
}
function retakePhoto(tid) {
  if(answers[tid]){delete answers[tid].value;delete answers[tid].photoBase64;}
  document.getElementById('pc_'+tid).classList.remove('answered');
  document.getElementById('photoArea_'+tid).style.display='block';
  document.getElementById('photoPreview_'+tid).style.display='none';
  document.getElementById('file_'+tid).value='';
  updateProgress();
}
async function handlePhotoExtra(tid, input) {
  if(!input.files||!input.files[0]) return;
  var xid=tid+'_xph';
  var b64=await compressImage(input.files[0]);
  answers[tid]=Object.assign(answers[tid]||{},{photoBase64:b64});
  document.getElementById('photoArea_'+xid).style.display='none';
  document.getElementById('previewImg_'+xid).src=b64;
  document.getElementById('photoPreview_'+xid).style.display='flex';
  updateProgress();
}
function retakePhotoExtra(tid) {
  var xid=tid+'_xph';
  if(answers[tid]) delete answers[tid].photoBase64;
  document.getElementById('photoArea_'+xid).style.display='block';
  document.getElementById('photoPreview_'+xid).style.display='none';
  document.getElementById('file_'+xid).value='';
  updateProgress();
}
function setWrongToday(val) {
  var card=document.getElementById('pc___wrongToday__');
  if(val.trim()){ answers['__wrongToday__']={value:val.trim(),status:'OK'}; card.classList.add('answered'); }
  else{ delete answers['__wrongToday__']; card.classList.remove('answered'); }
  updateProgress();
}

/* ── PROGRESS ─────────────────────────────────────────── */
function updateProgress() {
  var done=Object.keys(answers).filter(function(k){return k!=='__wrongToday__';}).length;
  document.getElementById('progressCount').textContent=done+' / '+totalTasks;
  var pct=totalTasks>0?(done/totalTasks)*100:0;
  var fill=document.getElementById('progressFill');
  fill.style.width=pct+'%'; fill.classList.toggle('complete',pct>=100);
  var allM=mandatoryIds.every(function(id){return answers[id]&&answers[id].value;});
  var allP=photoRequiredIds.every(function(id){return answers[id]&&answers[id].photoBase64;});
  document.getElementById('submitBtn').disabled=!(allM&&allP);
  var missing=[];
  mandatoryIds.filter(function(id){return !answers[id]||!answers[id].value;}).forEach(function(id){
    if(id==='__wrongToday__'){missing.push('"What went wrong today?"');return;}
    sections.forEach(function(s){s.tasks.forEach(function(t){if(t.taskId===id) missing.push(t.taskName.substring(0,28)+'...');});});
  });
  var el=document.getElementById('validationMsg');
  if(missing.length>0&&done>0){ el.textContent='Pending: '+missing.slice(0,2).join(', ')+(missing.length>2?' +'+(missing.length-2)+' more':''); el.style.display='block'; }
  else el.style.display='none';
}

/* ── SUBMIT ───────────────────────────────────────────── */
async function submitChecklist() {
  var btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='Submitting...';
  var entries=[];
  sections.forEach(function(sec){
    sec.tasks.forEach(function(task){
      var ans=answers[task.taskId]||{};
      entries.push({
        section:sec.section, taskId:task.taskId, taskName:task.taskName, type:task.type,
        response:ans.value||'', photoBase64:ans.photoBase64||'', photoUrl:'',
        status:ans.status||(ans.value?'OK':'MISS'), remarks:ans.remarks||''
      });
    });
  });
  entries.push({
    section:'Daily Report', taskId:'__wrongToday__', taskName:'What went wrong today?', type:'text',
    response:document.getElementById('wrongTodayInput').value.trim(),
    photoBase64:'', photoUrl:'', status:'OK', remarks:''
  });
  var res=await postApi({action:'submitChecklist',staffName:currentUser.name,role:currentUser.role,entries:entries});
  if(res.ok){
    var dt=getISTDate();
    document.getElementById('successMsg').textContent=currentUser.name+' - '+currentUser.role+' checklist submitted.';
    document.getElementById('successTime').textContent=dt.label+' at '+dt.time+' IST';
    showScreen('successScreen');
  } else {
    showToast(res.error||'Submission failed. Please try again.','error');
    btn.disabled=false; btn.textContent='Submit Checklist';
  }
}

/* ── LOGOUT ───────────────────────────────────────────── */
function logout() {
  pinBuffer=''; currentUser=null; answers={}; sections=[];
  renderDots();
  document.getElementById('pinError').textContent='';
  document.getElementById('checklistBody').innerHTML='';
  document.getElementById('progressFill').style.width='0%';
  document.getElementById('progressCount').textContent='0 / 0';
  var wt=document.getElementById('wrongTodayInput'); if(wt) wt.value='';
  showScreen('pinScreen');
}

document.addEventListener('DOMContentLoaded', function() {
  sessionStorage.removeItem('cbAuth');
  showScreen('pinScreen');
});
</script>
