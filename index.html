<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Store Operation Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#1E2D5A;--navy-l:#EEF1FB;--gold:#B8860B;
  --crimson:#C0392B;--green:#1E7A1E;--green-l:#D1FAE5;
  --orange:#D97706;--orange-l:#FEF3C7;
  --ink:#1A1A2E;--ink-60:rgba(26,26,46,.6);--ink-30:rgba(26,26,46,.3);--ink-10:rgba(26,26,46,.06);
  --ivory:#F9F7F0;--white:#fff;--border:#E8E4D8;--r:12px;--r-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--navy);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;outline:0;-webkit-tap-highlight-color:transparent}
input,textarea{font-family:inherit;outline:0}
/* --- screens --- */
.page{display:none;min-height:100vh}

#pg-load{background:var(--ivory);min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#pg-list{background:var(--ivory);min-height:100vh}
#pg-done{background:var(--ivory);min-height:100vh;display:flex;align-items:center;justify-content:center}
/* --- pin card --- */







/* --- dots --- */



/* --- numpad --- */








/* --- topbar --- */
.topbar{background:var(--navy);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-logo{height:36px;width:48px;object-fit:contain;background:rgba(255,255,255,.1);border-radius:8px;padding:4px}
.tb-title{font-family:"DM Serif Display",serif;color:#fff;font-size:15px;line-height:1.2}
.tb-sub{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px}
.tb-right{display:flex;align-items:center;gap:8px}
.rbadge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;text-transform:uppercase}
.back{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
/* --- progress --- */
.prog-bar-wrap{background:var(--white);padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:90}
.prog-row{display:flex;justify-content:space-between;margin-bottom:6px}
.prog-lbl{font-size:12px;font-weight:600;color:var(--ink)}
.prog-n{font-size:12px;color:var(--ink-60)}
.pbar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.pfill{height:100%;border-radius:3px;background:var(--gold);transition:width .3s}
.pfill.c{background:var(--green)}
/* --- task cards --- */
.cl-body{padding-bottom:90px;max-width:640px;margin:0 auto}
.sec{padding:18px 16px 8px}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-n{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-nm{font-family:"DM Serif Display",serif;font-size:17px;color:var(--navy)}
.sec-div{height:1px;background:var(--border);margin-bottom:14px}
.tc{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1.5px solid var(--border);transition:border-color .2s}
.tc.ok{border-color:var(--gold)}
.tc.fail{border-color:var(--crimson);background:#fffcfc}
.tc-lbl{font-size:13px;color:var(--ink);line-height:1.4;margin-bottom:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.mb{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--navy-l);color:var(--navy)}
.pb{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--orange-l);color:var(--orange)}
.yno{display:flex;gap:8px;margin-top:10px}
.yb{flex:1;padding:11px 8px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--ivory);color:var(--ink-60);transition:all .15s}
.yb.y.on{background:var(--green-l);border-color:var(--green);color:var(--green)}
.yb.n.on{background:var(--crimson-l);border-color:var(--crimson);color:var(--crimson)}
.stars{display:flex;gap:6px;margin-top:10px}
.star{font-size:28px;cursor:pointer;color:var(--border);line-height:1}
.star.on{color:#F59E0B}
.photo-area{background:var(--navy-l);border:1.5px dashed var(--navy);border-radius:var(--r-sm);padding:14px;text-align:center;margin-top:10px}
.phbtn{padding:10px 18px;border-radius:var(--r-sm);background:var(--navy);color:#fff;font-size:13px;font-weight:600}
.ph-prev{display:none;flex-direction:column;gap:8px;margin-top:10px}
.ph-prev img{width:100%;max-height:200px;object-fit:cover;border-radius:var(--r-sm);border:1.5px solid var(--border)}
.retake{font-size:12px;font-weight:600;color:var(--navy);background:var(--navy-l);border:1.5px solid var(--navy);padding:5px 14px;border-radius:6px}
.rm,.ti{width:100%;margin-top:10px;padding:9px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:12px;color:var(--ink);background:var(--ivory);resize:none;height:52px;line-height:1.4}
.ti.tall{height:72px}
.wcard{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1.5px solid var(--crimson-l)}
.wcard.ok{border-color:var(--green)}
/* --- submit --- */
.sub-wrap{position:fixed;bottom:0;left:0;right:0;padding:10px 16px 14px;background:var(--ivory);border-top:1px solid var(--border);z-index:80}
.vmsg{font-size:11px;color:var(--orange);margin-bottom:8px;padding:6px 10px;background:var(--orange-l);border-radius:6px;display:none}
.sub-wrap-btns{display:flex;gap:8px;align-items:stretch}
.draft-btn{padding:14px 16px;border-radius:var(--r);background:var(--navy-l);color:var(--navy);font-size:13px;font-weight:700;border:1.5px solid var(--navy);transition:all .2s;white-space:nowrap;flex-shrink:0}
.draft-btn.saved{background:var(--green-l);color:var(--green);border-color:var(--green)}
.draft-restored{font-size:11px;font-weight:600;color:var(--green);background:var(--green-l);padding:6px 10px;border-radius:6px;margin-bottom:8px;display:none}
.sub-btn{flex:1;padding:15px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:15px;font-weight:700;transition:opacity .2s}
.sub-btn:disabled{opacity:.45;cursor:not-allowed}
/* --- success --- */
.done-body{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px;gap:12px;min-height:100vh;justify-content:center}
.done-body h2{font-family:"DM Serif Display",serif;font-size:28px;color:var(--navy)}
.done-body p{font-size:14px;color:var(--ink-60)}
.ok-btn{padding:14px 32px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:15px;font-weight:700;margin-top:12px}
/* --- loader --- */
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--navy);animation:spin .7s linear infinite}
/* --- toast --- */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:999;transition:transform .3s,opacity .3s;white-space:nowrap;pointer-events:none;max-width:90vw;text-align:center;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{background:var(--crimson)}
@keyframes spin{to{transform:rotate(360deg)}}
/* C&B logo footer */
/* C&B below pin-card on navy bg */
.cb-outer{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:18px}
.cb-outer-lbl{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase}
.cb-outer-img{height:26px;width:auto;mix-blend-mode:screen;opacity:.85}
/* BSC logo: screen blend removes black bg on dark container */


/* Fix: prevent page scroll on non-checklist screens */
html,body{height:100%;overflow:hidden}
#pg-pin,#pg-load,#pg-done{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto}
#pg-list{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto}

/* Fix: success screen properly centered */
#pg-done{display:none;background:var(--ivory);align-items:center;justify-content:center}

/* ── PIN SCREEN ─────────────────────────────────────────── */
#pg-pin{position:fixed;inset:0;background:#1C2951;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.logo-icon{width:96px;height:96px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:18px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.s-name{font-family:"DM Serif Display",serif;font-size:22px;color:#fff;margin-bottom:5px}
.tagline{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.14em;text-transform:uppercase;margin-bottom:28px}
.app-nm{font-size:11px;font-weight:700;color:rgba(255,215,0,.85);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.pin-hint{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.dots{display:flex;gap:16px;justify-content:center;margin-bottom:28px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:transparent;transition:all .18s}
.dot.on{background:#fff;border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.4)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;margin-bottom:0}
.k{width:72px;height:72px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-size:22px;font-weight:600;border:1px solid rgba(255,255,255,.08);transition:background .12s,transform .1s;-webkit-tap-highlight-color:transparent}
.k:active{background:rgba(255,255,255,.22);transform:scale(.93)}
.k-del{background:rgba(192,57,43,.65);border-color:rgba(192,57,43,.3);font-size:17px;color:#ffb3a8}
.k-del:active{background:rgba(192,57,43,.9)}
.k-zero{grid-column:2}
.pin-msg{font-size:12px;min-height:20px;margin-top:12px;color:#ff8b7e;text-align:center}
.pin-msg.info{color:rgba(255,255,255,.55)}
.cb-mark{position:absolute;bottom:20px;display:flex;align-items:center;justify-content:center}
.cb-mark img{height:22px;width:auto;opacity:.55}
</style>
</head>
<body>

<!-- PIN PAGE -->
<div id="pg-pin">
  <!-- BSC logo: canvas removes black bg at runtime -->
  <div class="logo-icon"><img id="bscLogo" alt="BSC"/></div>
  <div class="s-name">BSC The Textile Mall</div>
  <div class="tagline">Belagavi &middot; Since 1938</div>
  <div class="app-nm">Store Operation Checklist</div>
  <div class="pin-hint">Enter your 4-digit PIN</div>
  <div class="dots">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>
  <div class="pad">
    <button class="k" onclick="kp(1)">1</button>
    <button class="k" onclick="kp(2)">2</button>
    <button class="k" onclick="kp(3)">3</button>
    <button class="k" onclick="kp(4)">4</button>
    <button class="k" onclick="kp(5)">5</button>
    <button class="k" onclick="kp(6)">6</button>
    <button class="k" onclick="kp(7)">7</button>
    <button class="k" onclick="kp(8)">8</button>
    <button class="k" onclick="kp(9)">9</button>
    <button class="k k-zero" onclick="kp(0)">0</button>
    <button class="k k-del"  onclick="kd()">&#9003;</button>
  </div>
  <div class="pin-msg" id="pmsg"></div>
  <!-- C&B logo: small, bottom of screen -->
  <div class="cb-mark"><img id="cbLogo" alt="C&amp;B Consulting &amp; Beyond"/></div>
</div>

<!-- LOADING PAGE -->
<div id="pg-load" class="page" style="display:none">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--ink-60)">Loading checklist...</div>
</div>

<!-- CHECKLIST PAGE -->
<div id="pg-list" class="page" style="display:none">
  <div class="topbar">
    <div class="tb-left">
      <img class="tb-logo" id="topbarLogo" alt="BSC"/>
      <div>
        <div class="tb-title">Store Operation Checklist</div>
        <div class="tb-sub" id="cl-sub">-</div>
      </div>
    </div>
    <div class="tb-right">
      <div class="rbadge" id="cl-role">-</div>
      <button class="back" onclick="goHome()">&#8617;</button>
    </div>
  </div>
  <div class="prog-bar-wrap">
    <div class="prog-row"><span class="prog-lbl">Progress</span><span class="prog-n" id="pn">0 / 0</span></div>
    <div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
  </div>
  <div class="cl-body" id="cl-body"></div>
  <div class="sub-wrap">
    <div class="draft-restored" id="draftBanner"></div>
    <div class="vmsg" id="vmsg"></div>
    <div class="sub-wrap-btns">
      <button class="draft-btn" id="draftBtn" onclick="saveDraft()">&#128190; Save Draft</button>
      <button class="sub-btn" id="sub-btn" onclick="submitChecklist()" disabled>Submit Checklist</button>
    </div>
  </div>
</div>

<!-- SUCCESS PAGE -->
<div id="pg-done" class="page" style="display:none">
  <div class="done-body">
    <div style="font-size:64px">&#9989;</div>
    <h2>Submitted!</h2>
    <p id="done-msg">Checklist submitted.</p>
    <p id="done-time" style="font-size:12px;color:var(--ink-30)"></p>
    <button class="ok-btn" onclick="goHome()">&#8592; Back to Home</button>
  </div>
</div>

<div id="toast"></div>

<script>
// IMPORTANT: paste your Apps Script Web App URL below
var API = "https://script.google.com/macros/s/AKfycbzT-GnqHn6EfZnNMl2JdqwTfaOoKLklHe0PN4CSynq-c2nZWa1t43_8vNyvCrkpHqSyhQ/exec";

// state
var pin = "";
var me  = null;
var secs = [];
var ans  = {};
var must = [];
var pics = [];
var tot  = 0;

// -- dots --
function dots() {
  for (var i = 0; i < 4; i++) {
    var el = document.getElementById("d" + i);
    if (i < pin.length) { el.classList.add("on"); }
    else { el.classList.remove("on"); }
  }
}

// -- keypress --
function kp(n) {
  if (pin.length >= 4) return;
  pin = pin + String(n);
  dots();
  if (pin.length === 4) {
    setTimeout(validatePin, 200);
  }
}

// -- delete --
function kd() {
  if (pin.length === 0) return;
  pin = pin.slice(0, -1);
  dots();
  setMsg("", "");
}

// -- message --
function setMsg(txt, type) {
  var el = document.getElementById("pmsg");
  el.textContent = txt;
  el.className = "pin-msg" + (type ? " " + type : "");
}

// -- pages --
function goPage(id) {
  var pages = ["pg-pin","pg-load","pg-list","pg-done"];
  for (var i = 0; i < pages.length; i++) {
    var pg = document.getElementById(pages[i]);
    if (!pg) continue;
    if (pages[i] === id) {
      pg.style.display = "";        // let CSS take over
      pg.classList.remove("page");  // remove hidden class
      pg.classList.add("pg-active");
    } else {
      pg.style.display = "none";    // hide all others
      pg.classList.remove("pg-active");
    }
  }
  if (id !== "pg-pin") window.scrollTo(0, 0);
}

// -- toast --
function toast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = (type === "err") ? "err show" : "show";
  clearTimeout(t._t);
  t._t = setTimeout(function() { t.className = ""; }, 3500);
}

// -- safe escape --
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// -- IST date --
function ist() {
  var d = new Date(new Date().getTime() + 19800000);
  var dy = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var p = function(x) { return ("0" + x).slice(-2); };
  return {
    lbl: dy[d.getUTCDay()] + " " + d.getUTCDate() + " " + mo[d.getUTCMonth()] + " " + d.getUTCFullYear(),
    t:   p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()),
    str: d.getUTCFullYear() + "-" + p(d.getUTCMonth()+1) + "-" + p(d.getUTCDate())
  };
}

// -- API GET --
function apiGet(action, params, cb) {
  if (!API || API.indexOf("YOUR_") === 0) {
    cb({ ok: false, error: "API URL not set. Add your Apps Script URL to API variable." });
    return;
  }
  var q = "action=" + encodeURIComponent(action);
  if (params) {
    var keys = Object.keys(params);
    for (var i = 0; i < keys.length; i++) {
      q += "&" + encodeURIComponent(keys[i]) + "=" + encodeURIComponent(String(params[keys[i]]));
    }
  }
  fetch(API + "?" + q, { redirect: "follow" })
    .then(function(r) { return r.text(); })
    .then(function(txt) {
      try { cb(JSON.parse(txt)); }
      catch(e) {
        if (txt.indexOf("DOCTYPE") > -1) {
          cb({ ok: false, error: "Apps Script returned HTML. Re-deploy with Who has access = Anyone." });
        } else {
          cb({ ok: false, error: "Bad response: " + txt.slice(0, 80) });
        }
      }
    })
    .catch(function(e) { cb({ ok: false, error: "Network error: " + e.message }); });
}

// -- API POST --
function apiPost(data, cb) {
  if (!API || API.indexOf("YOUR_") === 0) {
    cb({ ok: false, error: "API URL not set." }); return;
  }
  fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data),
    redirect: "follow"
  })
  .then(function(r) { return r.text(); })
  .then(function(txt) {
    try { cb(JSON.parse(txt)); }
    catch(e) {
      if (txt.indexOf("DOCTYPE") > -1) {
        cb({ ok: false, error: "Apps Script returned HTML. Set Who has access = Anyone in deployment." });
      } else { cb({ ok: false, error: "Server error" }); }
    }
  })
  .catch(function(err) {
    // Fallback: GET without photos
    var e2 = { action: data.action, staffName: data.staffName || "", role: data.role || "" };
    var entries = (data.entries || []).map(function(en) {
      return { section:en.section, taskId:en.taskId, taskName:en.taskName, type:en.type,
               response:en.response||"", photoUrl:"", status:en.status||"OK", remarks:en.remarks||"" };
    });
    e2.entries = JSON.stringify(entries);
    var q = "";
    Object.keys(e2).forEach(function(k) { q += (q?"&":"") + k + "=" + encodeURIComponent(String(e2[k])); });
    fetch(API + "?" + q, { redirect: "follow" })
      .then(function(r) { return r.text(); })
      .then(function(t) { try { cb(JSON.parse(t)); } catch(e) { cb({ ok:false,error:"Submit failed" }); } })
      .catch(function() { cb({ ok:false,error:"No connection" }); });
  });
}

// -- compress image --
function compress(file, cb) {
  var rd = new FileReader();
  rd.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var c = document.createElement("canvas");
      var w = img.width, h = img.height, m = 600;
      if (w > m) { h = Math.round(h * m / w); w = m; }
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(c.toDataURL("image/jpeg", 0.6));
    };
    img.src = e.target.result;
  };
  rd.readAsDataURL(file);
}

// -- validate PIN --
function validatePin() {
  setMsg("Checking...", "info");
  apiGet("validatePin", { pin: pin }, function(r) {
    if (!r.ok) { setMsg(r.error || "Invalid PIN", "err"); pin = ""; dots(); return; }
    me = { name: r.name, role: r.role };
    if (r.role === "Owner") {
      sessionStorage.setItem("cbAuth", JSON.stringify(me));
      location.href = "dashboard.html";
      return;
    }
    goPage("pg-load");
    loadChecklist(r.role);
  });
}

// -- load checklist --
function loadChecklist(role) {
  // Timeout guard: if no response in 15s, show error
  var loadTimer = setTimeout(function() {
    toast("Checklist is taking too long. Check your Apps Script URL and deployment.", "err");
    goPage("pg-pin");
  }, 15000);

  apiGet("getChecklist", { role: role }, function(r) {
    clearTimeout(loadTimer); // cancel timeout - we got a response

    if (!r.ok || !r.sections) {
      toast(r.error || "Could not load checklist. Check Apps Script deployment.", "err");
      goPage("pg-pin");
      return;
    }

    try {
      secs = r.sections; ans = {}; must = []; pics = []; tot = 0;
      for (var si = 0; si < secs.length; si++) {
        for (var ti = 0; ti < secs[si].tasks.length; ti++) {
          var t = secs[si].tasks[ti]; tot++;
          if (t.mandatory)     must.push(t.taskId);
          if (t.photoRequired) pics.push(t.taskId);
        }
      }
      must.push("__w__");

      var dt = ist();
      document.getElementById("cl-sub").textContent  = dt.lbl + " \u00B7 " + me.name;
      document.getElementById("cl-role").textContent = me.role;

      buildChecklist();

      // Auto-restore draft if one exists for today
      var draft = loadDraftFromStorage();
      if (draft) {
        restoreDraft(draft);
        var banner = document.getElementById("draftBanner");
        if (banner) {
          banner.textContent = "\u21BA Draft restored from " + draft.savedAt + " \u2014 continue where you left off";
          banner.style.display = "block";
        }
      }

      goPage("pg-list");

    } catch(err) {
      // buildChecklist or restoreDraft threw - surface the error
      toast("Error building checklist: " + err.message, "err");
      goPage("pg-pin");
    }
  });
}

// -- build checklist HTML --
function buildChecklist() {
  var b = document.getElementById("cl-body"), html = "";
  for (var si = 0; si < secs.length; si++) {
    var s = secs[si];
    html += '<div class="sec"><div class="sec-hdr"><div class="sec-n">' + (si+1) + '</div><div class="sec-nm">' + esc(s.section) + '</div></div><div class="sec-div"></div>';
    for (var ti = 0; ti < s.tasks.length; ti++) html += taskHtml(s.tasks[ti], s.section);
    html += '</div>';
  }
  html += '<div class="sec">' +
    '<div class="sec-hdr"><div class="sec-n" style="background:var(--crimson)">!</div><div class="sec-nm">Daily Report</div></div><div class="sec-div"></div>' +
    '<div class="wcard" id="wc"><div class="tc-lbl">What went wrong today? <span class="mb">Mandatory</span></div>' +
    '<div style="font-size:11px;color:var(--ink-30);margin:4px 0 8px">Describe any issues or incidents</div>' +
    '<textarea class="ti tall" id="winp" oninput="setW(this.value)" placeholder="e.g. AC off in section B..."></textarea></div></div><div style="height:24px"></div>';
  b.innerHTML = html; updateProg();
}

function taskHtml(t, sec) {
  var id = t.taskId;
  var mb = t.mandatory     ? '<span class="mb">Mandatory</span>' : "";
  var pb = t.photoRequired ? '<span class="pb">Photo</span>'     : "";
  var ctrl = "";

  if (t.type === "yesno") {
    ctrl = '<div class="yno">'
         + '<button class="yb y" id="y_' + id + '" data-id="' + id + '" data-v="yes" onclick="ynBtn(this)">Yes</button>'
         + '<button class="yb n" id="n_' + id + '" data-id="' + id + '" data-v="no"  onclick="ynBtn(this)">No</button>'
         + '</div>'
         + '<div id="rd_' + id + '" style="display:none">'
         + '<textarea class="rm" data-id="' + id + '" placeholder="Describe issue..." oninput="remTA(this)"></textarea>'
         + '</div>'
         + (t.photoRequired ? xp(id) : "");

  } else if (t.type === "rating") {
    ctrl = '<div class="stars" id="st_' + id + '">'
         + '<span class="star" data-id="' + id + '" data-n="1" onclick="starBtn(this)">&#9733;</span>'
         + '<span class="star" data-id="' + id + '" data-n="2" onclick="starBtn(this)">&#9733;</span>'
         + '<span class="star" data-id="' + id + '" data-n="3" onclick="starBtn(this)">&#9733;</span>'
         + '<span class="star" data-id="' + id + '" data-n="4" onclick="starBtn(this)">&#9733;</span>'
         + '<span class="star" data-id="' + id + '" data-n="5" onclick="starBtn(this)">&#9733;</span>'
         + '</div>'
         + '<div id="rd_' + id + '" style="display:none">'
         + '<textarea class="rm" data-id="' + id + '" placeholder="Remarks..." oninput="remTA(this)"></textarea>'
         + '</div>'
         + (t.photoRequired ? xp(id) : "");

  } else if (t.type === "photo") {
    ctrl = '<div style="margin-top:10px">'
         + '<input type="file" accept="image/*" capture="environment" id="fi_' + id + '" style="display:none" data-id="' + id + '" onchange="phFile(this)"/>'
         + '<div class="photo-area" id="pa_' + id + '">'
         + '<button class="phbtn" data-target="fi_' + id + '" onclick="triggerFile(this)">Take / Upload Photo</button>'
         + '</div>'
         + '<div class="ph-prev" id="pp_' + id + '">'
         + '<img id="pi_' + id + '" alt=""/>'
         + '<button class="retake" data-id="' + id + '" onclick="rpBtn(this)">Retake</button>'
         + '</div>'
         + '<textarea class="rm" data-id="' + id + '" placeholder="Photo remarks..." oninput="remTA(this)"></textarea>'
         + '</div>';

  } else if (t.type === "text") {
    ctrl = '<textarea class="ti" id="tx_' + id + '" data-id="' + id + '" style="margin-top:10px" placeholder="Enter response..." oninput="txtTA(this)"></textarea>'
         + (t.photoRequired ? xp(id) : "");
  }

  return '<div class="tc" id="tc_' + id + '"><div class="tc-lbl">' + esc(t.taskName) + ' ' + mb + pb + '</div>' + ctrl + '</div>';
}

function xp(id) {
  var x = id + "x";
  return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">'
       + '<div style="font-size:11px;font-weight:600;color:var(--orange);margin-bottom:6px">Photo required</div>'
       + '<input type="file" accept="image/*" capture="environment" id="fi_' + x + '" style="display:none" data-id="' + id + '" data-extra="1" onchange="phFile(this)"/>'
       + '<div class="photo-area" id="pa_' + x + '" style="padding:10px">'
       + '<button class="phbtn" style="padding:7px 14px;font-size:12px" data-target="fi_' + x + '" onclick="triggerFile(this)">Take Photo</button>'
       + '</div>'
       + '<div class="ph-prev" id="pp_' + x + '">'
       + '<img id="pi_' + x + '" style="max-height:120px" alt=""/>'
       + '<button class="retake" data-id="' + id + '" data-extra="1" onclick="rpBtn(this)">Retake</button>'
       + '</div>'
       + '</div>';
}

// -- data-* driven helpers (NO nested quotes in onclick needed) --
function ynBtn(btn) {
  yn(btn.getAttribute("data-id"), btn.getAttribute("data-v"));
}
function starBtn(btn) {
  rate(btn.getAttribute("data-id"), parseInt(btn.getAttribute("data-n"), 10));
}
function remTA(ta) {
  rem(ta.getAttribute("data-id"), ta.value);
}
function txtTA(ta) {
  txt(ta.getAttribute("data-id"), ta.value);
}
function triggerFile(btn) {
  var inp = document.getElementById(btn.getAttribute("data-target"));
  if (inp) inp.click();
}
function phFile(inp) {
  var id    = inp.getAttribute("data-id");
  var extra = inp.getAttribute("data-extra") === "1";
  if (!inp.files || !inp.files[0]) return;
  if (extra) { phx(id, inp); } else { ph(id, inp); }
}
function rpBtn(btn) {
  var id    = btn.getAttribute("data-id");
  var extra = btn.getAttribute("data-extra") === "1";
  if (extra) { rpx(id); } else { rp(id); }
}

// -- setters --
function yn(id, v) {
  if (!ans[id]) ans[id] = {};
  ans[id].v = v; ans[id].s = (v === "yes") ? "OK" : "FAIL";
  document.getElementById("tc_"+id).className = "tc " + (v === "no" ? "fail" : "ok");
  document.getElementById("y_"+id).className  = "yb y" + (v==="yes" ? " on" : "");
  document.getElementById("n_"+id).className  = "yb n" + (v==="no"  ? " on" : "");
  var rd = document.getElementById("rd_"+id); if (rd) rd.style.display = (v==="no") ? "block" : "none";
  updateProg();
}
function rate(id, n) {
  if (!ans[id]) ans[id] = {};
  ans[id].v = String(n); ans[id].s = (n >= 3) ? "OK" : "FAIL";
  var stars = document.getElementById("st_"+id).querySelectorAll(".star");
  for (var i = 0; i < stars.length; i++) stars[i].className = "star" + (i < n ? " on" : "");
  document.getElementById("tc_"+id).className = "tc " + (n < 3 ? "fail" : "ok");
  var rd = document.getElementById("rd_"+id); if (rd) rd.style.display = "block";
  updateProg();
}
function txt(id, v) {
  if (!ans[id]) ans[id] = {};
  ans[id].v = v.trim(); ans[id].s = v.trim() ? "OK" : "FAIL";
  document.getElementById("tc_"+id).className = "tc" + (v.trim() ? " ok" : "");
  updateProg();
}
function rem(id, v)  { if (!ans[id]) ans[id] = {}; ans[id].r = v; }
function setW(v) {
  var c = document.getElementById("wc");
  if (v.trim()) { ans["__w__"] = { v: v.trim(), s: "OK" }; c.className = "wcard ok"; }
  else          { delete ans["__w__"];                      c.className = "wcard"; }
  updateProg();
}
function ph(id, inp) {
  if (!inp.files || !inp.files[0]) return;
  compress(inp.files[0], function(b) {
    if (!ans[id]) ans[id] = {}; ans[id].v = "Photo"; ans[id].s = "OK"; ans[id].p = b;
    document.getElementById("tc_"+id).className = "tc ok";
    document.getElementById("pa_"+id).style.display = "none";
    document.getElementById("pi_"+id).src = b;
    document.getElementById("pp_"+id).style.display = "flex";
    updateProg();
  });
}
function rp(id) {
  if (ans[id]) { delete ans[id].v; delete ans[id].p; }
  document.getElementById("tc_"+id).className = "tc";
  document.getElementById("pa_"+id).style.display = "";
  document.getElementById("pp_"+id).style.display = "none";
  document.getElementById("fi_"+id).value = ""; updateProg();
}
function phx(id, inp) {
  if (!inp.files || !inp.files[0]) return;
  var x = id + "x";
  compress(inp.files[0], function(b) {
    if (!ans[id]) ans[id] = {}; ans[id].p = b;
    document.getElementById("pa_"+x).style.display = "none";
    document.getElementById("pi_"+x).src = b;
    document.getElementById("pp_"+x).style.display = "flex";
    updateProg();
  });
}
function rpx(id) {
  var x = id + "x"; if (ans[id]) delete ans[id].p;
  document.getElementById("pa_"+x).style.display = "";
  document.getElementById("pp_"+x).style.display = "none";
  document.getElementById("fi_"+x).value = ""; updateProg();
}

// -- progress --
function updateProg() {
  var done = 0;
  var keys = Object.keys(ans);
  for (var i = 0; i < keys.length; i++) if (keys[i] !== "__w__") done++;
  document.getElementById("pn").textContent = done + " / " + tot;
  var pct = tot > 0 ? Math.round((done / tot) * 100) : 0;
  var pf = document.getElementById("pf");
  pf.style.width = pct + "%";
  pf.className = "pfill" + (pct >= 100 ? " c" : "");
  var allM = true, allP = true;
  for (var m = 0; m < must.length; m++) {
    if (!ans[must[m]] || !ans[must[m]].v) { allM = false; break; }
  }
  for (var p = 0; p < pics.length; p++) {
    if (!ans[pics[p]] || !ans[pics[p]].p) { allP = false; break; }
  }
  document.getElementById("sub-btn").disabled = !(allM && allP);
  var miss = [];
  for (var mi = 0; mi < must.length; mi++) {
    var mid = must[mi];
    if (!ans[mid] || !ans[mid].v) {
      if (mid === "__w__") { miss.push('"'+'What went wrong?'+'"'); continue; }
      for (var si = 0; si < secs.length; si++) {
        for (var ti = 0; ti < secs[si].tasks.length; ti++) {
          if (secs[si].tasks[ti].taskId === mid) { miss.push(secs[si].tasks[ti].taskName.slice(0,30) + "..."); }
        }
      }
    }
  }
  var vm = document.getElementById("vmsg");
  if (miss.length > 0 && done > 0) {
    vm.textContent = "Pending: " + miss.slice(0,2).join(", ") + (miss.length > 2 ? " +" + (miss.length-2) + " more" : "");
    vm.style.display = "block";
  } else { vm.style.display = "none"; }
}

// -- submit --
function submitChecklist() {
  var btn = document.getElementById("sub-btn");
  btn.disabled = true; btn.textContent = "Submitting...";
  var entries = [];
  for (var si = 0; si < secs.length; si++) {
    var s = secs[si];
    for (var ti = 0; ti < s.tasks.length; ti++) {
      var t = s.tasks[ti], a = ans[t.taskId] || {};
      entries.push({
        section: s.section, taskId: t.taskId, taskName: t.taskName, type: t.type,
        response: a.v || "", photoBase64: a.p || "", photoUrl: "",
        status: a.s || (a.v ? "OK" : "MISS"), remarks: a.r || ""
      });
    }
  }
  var wi = document.getElementById("winp");
  entries.push({ section:"Daily Report",taskId:"__wrongToday__",taskName:"What went wrong today?",
    type:"text", response: wi ? wi.value.trim() : "", photoBase64:"",photoUrl:"",status:"OK",remarks:"" });
  apiPost({ action:"submitChecklist", staffName:me.name, role:me.role, entries:entries }, function(r) {
    if (r.ok) {
      var dt = ist();
      document.getElementById("done-msg").textContent  = me.name + " \u2014 " + me.role + " submitted.";
      document.getElementById("done-time").textContent = dt.lbl + " at " + dt.t + " IST";
      clearDraft(); // remove draft on successful submit
      goPage("pg-done");
    } else {
      toast(r.error || "Submission failed", "err");
      btn.disabled = false; btn.textContent = "Submit Checklist";
    }
  });
}

// -- Remove black background from logo images via canvas --
function stripBlack(src, threshold, callback) {
  var img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = function() {
    var c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    var ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);
    var d = ctx.getImageData(0, 0, c.width, c.height);
    var px = d.data;
    for (var i = 0; i < px.length; i += 4) {
      if (px[i] < threshold && px[i+1] < threshold && px[i+2] < threshold) {
        px[i+3] = 0; // make near-black pixels transparent
      }
    }
    ctx.putImageData(d, 0, 0);
    callback(c.toDataURL("image/png"));
  };
  img.onerror = function() { callback(src); }; // fallback
  img.src = src;
}

// -- DRAFT: save / restore between sessions --

function draftKey() {
  var d    = ist().str;
  var name = (me ? me.name : 'x').replace(/\W+/g, '_');
  var role = (me ? me.role : 'x');
  return 'soc_' + role + '_' + name + '_' + d;
}

function saveDraft() {
  try {
    var draft = {
      staffName: me.name,
      role:      me.role,
      date:      ist().str,
      savedAt:   ist().t,
      answers:   ans
    };
    localStorage.setItem(draftKey(), JSON.stringify(draft));
    var btn = document.getElementById('draftBtn');
    btn.textContent = '\u2713 Saved';
    btn.classList.add('saved');
    setTimeout(function() {
      btn.textContent = '\u{1F4BE} Save Draft';
      btn.classList.remove('saved');
    }, 2000);
    toast('Draft saved at ' + ist().t);
  } catch(e) {
    toast('Draft save failed: ' + e.message, 'err');
  }
}

function loadDraftFromStorage() {
  try {
    var raw = localStorage.getItem(draftKey());
    if (!raw) return null;
    var draft = JSON.parse(raw);
    // Only restore if same role, same calendar date
    if (!draft || draft.role !== me.role || draft.date !== ist().str) {
      localStorage.removeItem(draftKey());
      return null;
    }
    return draft;
  } catch(e) { return null; }
}

function restoreDraft(draft) {
  ans = draft.answers || {};

  for (var si = 0; si < secs.length; si++) {
    var sec = secs[si];
    for (var ti = 0; ti < sec.tasks.length; ti++) {
      var t  = sec.tasks[ti];
      var id = t.taskId;
      var a  = ans[id];
      if (!a || !a.v) continue;

      var card = document.getElementById('tc_' + id);

      if (t.type === 'yesno') {
        var yEl = document.getElementById('y_' + id);
        var nEl = document.getElementById('n_' + id);
        var rd  = document.getElementById('rd_' + id);
        if (yEl) yEl.className = 'yb y' + (a.v === 'yes' ? ' on' : '');
        if (nEl) nEl.className = 'yb n' + (a.v === 'no'  ? ' on' : '');
        if (card) card.className = 'tc ' + (a.v === 'no' ? 'fail' : 'ok');
        if (rd)   rd.style.display = a.v === 'no' ? 'block' : 'none';
        if (a.r) {
          var rmEl = document.querySelector('[data-id="' + id + '"].rm');
          if (rmEl) rmEl.value = a.r;
        }

      } else if (t.type === 'rating') {
        var n    = parseInt(a.v, 10);
        var stEl = document.getElementById('st_' + id);
        if (stEl) {
          var stars = stEl.querySelectorAll('.star');
          for (var k = 0; k < stars.length; k++)
            stars[k].className = 'star' + (k < n ? ' on' : '');
        }
        if (card) card.className = 'tc ' + (n < 3 ? 'fail' : 'ok');

      } else if (t.type === 'text') {
        var txEl = document.getElementById('tx_' + id);
        if (txEl) txEl.value = a.v;
        if (card) card.className = 'tc ok';

      } else if (t.type === 'photo') {
        // Restore photo preview from stored base64
        if (a.p) {
          var paEl = document.getElementById('pa_' + id);
          var ppEl = document.getElementById('pp_' + id);
          var piEl = document.getElementById('pi_' + id);
          if (paEl) paEl.style.display = 'none';
          if (piEl) piEl.src = a.p;
          if (ppEl) ppEl.style.display = 'flex';
          if (card) card.className = 'tc ok';
        }
      }
    }
  }

  // Restore "What went wrong" field
  if (ans['__w__'] && ans['__w__'].v) {
    var wi = document.getElementById('winp');
    var wc = document.getElementById('wc');
    if (wi) wi.value = ans['__w__'].v;
    if (wc) wc.className = 'wcard ok';
  }

  updateProg();
}

function clearDraft() {
  try { localStorage.removeItem(draftKey()); } catch(e) {}
}

// -- go home --
function goHome() {
  pin = ""; me = null; ans = {}; secs = [];
  dots();
  setMsg("", "");
  document.getElementById("cl-body").innerHTML = "";
  document.getElementById("pf").style.width = "0%";
  document.getElementById("pn").textContent = "0 / 0";
  var wi = document.getElementById("winp"); if (wi) wi.value = "";
  goPage("pg-pin");
}
