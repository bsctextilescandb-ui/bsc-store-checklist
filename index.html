<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Store Operation Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#1E2D5A;--navy-d:#151F3E;--navy-l:#EEF1FB;
  --gold:#B8860B;--gold-l:#FEF3C7;
  --crimson:#C0392B;--crimson-l:#FEE2E2;
  --green:#1E7A1E;--green-l:#D1FAE5;
  --orange:#D97706;--orange-l:#FEF3C7;
  --ink:#1A1A2E;--ink-60:rgba(26,26,46,.6);--ink-30:rgba(26,26,46,.3);--ink-10:rgba(26,26,46,.06);
  --ivory:#F9F7F0;--white:#fff;--border:#E8E4D8;
  --r:12px;--r-sm:8px;--shadow:0 2px 12px rgba(26,26,46,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ivory);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:0;outline:0;-webkit-tap-highlight-color:transparent}
input,textarea{font-family:inherit;outline:0}
img{max-width:100%;display:block}

/* SCREENS */
.screen{display:none;min-height:100vh}
.screen.active{display:block}
#pinScreen.active,#loadingScreen.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
#successScreen.active{display:flex;align-items:center;justify-content:center}

/* PIN CARD */
#pinScreen{background:var(--navy);padding:24px}
.pin-card{background:var(--white);border-radius:20px;padding:32px 28px 28px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:su .35s ease}
.pin-logo-wrap{width:90px;height:64px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;background:var(--navy);border-radius:12px;padding:6px}
.pin-logo-wrap img{width:100%;height:100%;object-fit:contain}
.pin-store-name{font-family:'DM Serif Display',serif;font-size:20px;color:var(--navy);margin-bottom:2px}
.pin-tagline{font-size:11px;color:var(--ink-60);margin-bottom:4px}
.pin-app-name{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}
.pin-hint{font-size:12px;color:var(--ink-60);margin-bottom:18px}

/* DOTS */
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:24px}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink-30);background:transparent;transition:all .18s}
.pin-dot.filled{background:var(--navy);border-color:var(--navy)}

/* PAD */
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.pin-key{padding:16px 8px;border-radius:10px;background:var(--ivory);font-size:22px;font-weight:600;color:var(--ink);border:1.5px solid var(--border);transition:all .12s;user-select:none}
.pin-key:active{background:var(--navy-l);transform:scale(.94)}
.pin-key.del{font-size:16px;color:var(--crimson)}
.pin-key.zero{grid-column:2}
.pin-error{font-size:12px;color:var(--crimson);min-height:18px;margin-top:4px}

/* TOPBAR */
.topbar{background:var(--navy);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo-img{height:38px;width:50px;object-fit:contain;background:rgba(255,255,255,.1);border-radius:8px;padding:4px}
.topbar-title{font-family:'DM Serif Display',serif;color:#fff;font-size:15px;line-height:1.2}
.topbar-sub{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:8px}
.role-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;text-transform:uppercase}
.logout-btn{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}

/* PROGRESS */
.checklist-progress{background:var(--white);padding:13px 18px;border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:90}
.progress-info{display:flex;justify-content:space-between;margin-bottom:7px}
.progress-label{font-size:12px;font-weight:600;color:var(--ink)}
.progress-count{font-size:12px;color:var(--ink-60)}
.progress-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--gold);transition:width .3s}
.progress-fill.done{background:var(--green)}

/* CHECKLIST BODY */
.checklist-body{padding-bottom:90px;max-width:640px;margin:0 auto}
.section-block{padding:18px 16px 8px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section-num{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-name{font-family:'DM Serif Display',serif;font-size:17px;color:var(--navy)}
.section-divider{height:1px;background:var(--border);margin-bottom:14px}
.point-card{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1.5px solid var(--border);transition:border-color .2s}
.point-card.answered{border-color:var(--gold)}
.point-card.answered.failed{border-color:var(--crimson);background:#fffcfc}
.point-label{font-size:13px;color:var(--ink);line-height:1.4;margin-bottom:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.mbadge{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--navy-l);color:var(--navy)}
.pbadge{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--orange-l);color:var(--orange)}
.point-controls{display:flex;gap:8px;margin-top:10px}
.yn-btn{flex:1;padding:11px 8px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--ivory);color:var(--ink-60);transition:all .18s}
.yn-btn.yes.on{background:var(--green-l);border-color:var(--green);color:var(--green)}
.yn-btn.no.on{background:var(--crimson-l);border-color:var(--crimson);color:var(--crimson)}
.star-rating{display:flex;gap:6px;margin-top:10px}
.star{font-size:28px;cursor:pointer;color:var(--border);transition:color .15s;line-height:1}
.star.on{color:#F59E0B}
.photo-area{background:var(--navy-l);border:1.5px dashed var(--navy);border-radius:var(--r-sm);padding:14px;text-align:center;margin-top:10px}
.photo-btn{padding:10px 18px;border-radius:var(--r-sm);background:var(--navy);color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.photo-preview{display:none;flex-direction:column;gap:8px;margin-top:10px}
.preview-img{width:100%;max-height:200px;object-fit:cover;border-radius:var(--r-sm);border:1.5px solid var(--border)}
.retake-btn{font-size:12px;font-weight:600;color:var(--navy);background:var(--navy-l);border:1.5px solid var(--navy);padding:5px 14px;border-radius:6px}
.remarks-input,.text-input{width:100%;margin-top:10px;padding:9px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:12px;color:var(--ink);background:var(--ivory);resize:none;height:52px;line-height:1.4}
.text-input.full{height:72px}
.wrong-card{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1.5px solid var(--crimson-l)}
.wrong-card.answered{border-color:var(--green)}
.submit-wrap{position:fixed;bottom:0;left:0;right:0;padding:10px 16px 14px;background:var(--ivory);border-top:1px solid var(--border);z-index:80}
.val-msg{font-size:11px;color:var(--orange);margin-bottom:8px;padding:6px 10px;background:var(--orange-l);border-radius:6px;display:none}
.submit-btn{width:100%;padding:15px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.submit-btn:disabled{opacity:.45;cursor:not-allowed}
.submit-btn:not(:disabled):active{transform:scale(.98)}
#successScreen{background:var(--ivory)}
.success-body{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px;gap:12px}
.success-icon{font-size:64px}
.success-body h2{font-family:'DM Serif Display',serif;font-size:28px;color:var(--navy)}
.success-body p{font-size:14px;color:var(--ink-60)}
.success-btn{padding:14px 32px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:15px;font-weight:700;margin-top:12px}
#loadingScreen{background:var(--ivory);gap:16px}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--navy);animation:spin .7s linear infinite}
.loader-text{font-size:13px;color:var(--ink-60)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s;white-space:nowrap;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.error{background:var(--crimson)}
#toast.success{background:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen" class="screen active">
  <div class="pin-card">
    <div class="pin-logo-wrap">
      <img id="pinLogo" alt="BSC"/>
    </div>
    <div class="pin-store-name">BSC The Textile Mall</div>
    <div class="pin-tagline">Belagavi &middot; Since 1938</div>
    <div class="pin-app-name">Store Operation Checklist</div>
    <div class="pin-hint">Enter your 4-digit PIN</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" id="k1">1</button>
      <button class="pin-key" id="k2">2</button>
      <button class="pin-key" id="k3">3</button>
      <button class="pin-key" id="k4">4</button>
      <button class="pin-key" id="k5">5</button>
      <button class="pin-key" id="k6">6</button>
      <button class="pin-key" id="k7">7</button>
      <button class="pin-key" id="k8">8</button>
      <button class="pin-key" id="k9">9</button>
      <button class="pin-key zero" id="k0">0</button>
      <button class="pin-key del" id="kdel">&#9003;</button>
    </div>
    <div id="pinError" class="pin-error"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loadingScreen" class="screen">
  <div class="spinner"></div>
  <div class="loader-text">Loading your checklist...</div>
</div>

<!-- CHECKLIST -->
<div id="checklistScreen" class="screen">
  <div class="topbar">
    <div class="topbar-brand">
      <img id="topLogo" class="topbar-logo-img" alt="BSC"/>
      <div>
        <div class="topbar-title">Store Operation Checklist</div>
        <div class="topbar-sub" id="clSub">-</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="role-badge" id="clRole">-</div>
      <button class="logout-btn" id="logoutBtn">&#8617;</button>
    </div>
  </div>
  <div class="checklist-progress">
    <div class="progress-info">
      <span class="progress-label">Progress</span>
      <span class="progress-count" id="progCount">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div class="checklist-body" id="clBody"></div>
  <div class="submit-wrap">
    <div class="val-msg" id="valMsg"></div>
    <button class="submit-btn" id="submitBtn" disabled>Submit Checklist</button>
  </div>
</div>

<!-- SUCCESS -->
<div id="successScreen" class="screen">
  <div class="success-body">
    <div class="success-icon">&#9989;</div>
    <h2>Submitted!</h2>
    <p id="sucMsg">Checklist submitted successfully.</p>
    <p id="sucTime" style="font-size:12px;color:var(--ink-30)"></p>
    <button class="success-btn" id="backBtn">&#8592; Back to Home</button>
  </div>
</div>

<div id="toast"></div>

// STATE
var user         = null;

// ── UTILITIES ──────────────────────────────────────────

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) {
    s.classList.remove('active');
  });
  var el = document.getElementById(id);
  if (el) el.classList.add('active');
  window.scrollTo(0, 0);
}

function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type || '';
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3500);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function istDate() {
  var now = new Date();
  var ist = new Date(now.getTime() + 5.5 * 3600000);
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var p = function(n) { return String(n).padStart(2,'0'); };
  return {
    str:   ist.getUTCFullYear()+'-'+p(ist.getUTCMonth()+1)+'-'+p(ist.getUTCDate()),
    label: days[ist.getUTCDay()]+', '+ist.getUTCDate()+' '+mons[ist.getUTCMonth()]+' '+ist.getUTCFullYear(),
    time:  p(ist.getUTCHours())+':'+p(ist.getUTCMinutes())
  };
}

function callAPI(action, params) {
  var q = 'action=' + encodeURIComponent(action);
  if (params) {
    Object.keys(params).forEach(function(k) {
      q += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    });
  }
  return fetch(API_URL + '?' + q, { redirect: 'follow' })
    .then(function(r) { return r.json(); })
    .catch(function(e) { return { ok: false, error: 'Network error: ' + e.message }; });
}

function postAPI(data) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data),
    redirect: 'follow'
  })
  .then(function(r) { return r.json(); })
  .catch(function(e) {
    // GET fallback (no photos)
    var clean = Object.assign({}, data);
    if (Array.isArray(clean.entries)) {
      clean.entries = clean.entries.map(function(en) {
        var c = Object.assign({}, en);
        delete c.photoBase64;
        return c;
      });
    }
    var q = 'action=submitChecklist&staffName=' + encodeURIComponent(clean.staffName || '') +
            '&role=' + encodeURIComponent(clean.role || '') +
            '&entries=' + encodeURIComponent(JSON.stringify(clean.entries || []));
    return fetch(API_URL + '?' + q, { redirect: 'follow' })
      .then(function(r) { return r.json(); })
      .catch(function(e2) { return { ok: false, error: 'Submission failed. Check connection.' }; });
  });
}

function compress(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var w = img.width, h = img.height, max = 600;
        if (w > max) { h = Math.round(h * max / w); w = max; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── PIN ────────────────────────────────────────────────

function fillDots() {
  var dots = document.querySelectorAll('#pinDots .pin-dot');
  dots.forEach(function(d, i) {
    d.classList.toggle('filled', i < pin.length);
  });
}

function pinErr(msg, isErr) {
  var el = document.getElementById('pinError');
  el.textContent = msg;
  el.style.color = (isErr === false) ? 'var(--ink-60)' : 'var(--crimson)';
}

function pressKey(d) {
  if (pin.length >= 4) return;
  pin += d;
  fillDots();
  if (pin.length === 4) {
    setTimeout(validatePIN, 150);
  }
}

function deleteKey() {
  if (pin.length === 0) return;
  pin = pin.slice(0, -1);
  fillDots();
  pinErr('');
}

function validatePIN() {
  pinErr('Checking...', false);
  callAPI('validatePin', { pin: pin }).then(function(res) {
    if (!res.ok) {
      pinErr(res.error || 'Invalid PIN. Please try again.');
      pin = ''; fillDots(); return;
    }
    user = { name: res.name, role: res.role };
    if (res.role === 'Owner') {
      sessionStorage.setItem('cbAuth', JSON.stringify(user));
      window.location.href = 'dashboard.html';
      return;
    }
    showScreen('loadingScreen');
    loadChecklist(res.role);
  });
}

// Attach PIN buttons using addEventListener (not onclick in HTML)
window.addEventListener('load', function() {
  '1234567890'.split('').forEach(function(d) {
    var btn = document.getElementById('k' + d);
    if (btn) btn.addEventListener('click', function() { pressKey(d); });
  });
  var del = document.getElementById('kdel');
  if (del) del.addEventListener('click', deleteKey);
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('submitBtn').addEventListener('click', submitChecklist);
  document.getElementById('backBtn').addEventListener('click', logout);
});

// ── CHECKLIST ──────────────────────────────────────────

function loadChecklist(role) {
  callAPI('getChecklist', { role: role }).then(function(res) {
    if (!res.ok || !res.sections) {
      toast(res.error || 'Failed to load checklist.', 'error');
      showScreen('pinScreen'); return;
    }
    sections = res.sections; answers = {};
    mandatoryIds = []; photoIds = []; totalTasks = 0;
    sections.forEach(function(sec) {
      sec.tasks.forEach(function(t) {
        totalTasks++;
        if (t.mandatory)     mandatoryIds.push(t.taskId);
        if (t.photoRequired) photoIds.push(t.taskId);
      });
    });
    mandatoryIds.push('__wrong__');

    var dt = istDate();
    document.getElementById('clSub').textContent  = dt.label + ' · ' + user.name;
    document.getElementById('clRole').textContent = user.role;
    buildChecklist();
    showScreen('checklistScreen');
  });
}

function buildChecklist() {
  var body = document.getElementById('clBody');
  var html = '';
  sections.forEach(function(sec, si) {
    html += '<div class="section-block">' +
      '<div class="section-header">' +
        '<div class="section-num">' + (si+1) + '</div>' +
        '<div class="section-name">' + esc(sec.section) + '</div>' +
      '</div><div class="section-divider"></div>';
    sec.tasks.forEach(function(t) { html += taskCard(t); });
    html += '</div>';
  });
  // Final question
  html += '<div class="section-block">' +
    '<div class="section-header">' +
      '<div class="section-num" style="background:var(--crimson)">!</div>' +
      '<div class="section-name">Daily Report</div>' +
    '</div><div class="section-divider"></div>' +
    '<div class="wrong-card" id="pc__wrong__">' +
      '<div class="point-label">What went wrong today? <span class="mbadge">Mandatory</span></div>' +
      '<div style="font-size:11px;color:var(--ink-30);margin:4px 0 8px">Describe any issues or incidents</div>' +
      '<textarea class="text-input full" id="wrongInput" placeholder="e.g. AC off in section B..."></textarea>' +
    '</div></div><div style="height:24px"></div>';
  body.innerHTML = html;

  // Attach wrong-today listener
  document.getElementById('wrongInput').addEventListener('input', function() {
    var v = this.value.trim();
    var card = document.getElementById('pc__wrong__');
    if (v) { answers['__wrong__'] = {val:v,status:'OK'}; card.classList.add('answered'); }
    else   { delete answers['__wrong__'];                  card.classList.remove('answered'); }
    updateProgress();
  });

  // Attach photo listeners
  sections.forEach(function(sec) {
    sec.tasks.forEach(function(t) { attachTaskListeners(t); });
  });

  updateProgress();
}

function taskCard(t) {
  var mb = t.mandatory     ? '<span class="mbadge">Mandatory</span>' : '';
  var pb = t.photoRequired ? '<span class="pbadge">Photo</span>'     : '';
  var ctrl = '';
  var id = t.taskId;

  if (t.type === 'yesno') {
    ctrl = '<div class="point-controls">' +
      '<button class="yn-btn yes" id="y_'+id+'">Yes</button>' +
      '<button class="yn-btn no"  id="n_'+id+'">No</button></div>' +
      '<div id="r_'+id+'" style="display:none"><textarea class="remarks-input" id="rem_'+id+'" placeholder="Describe the issue..."></textarea></div>' +
      (t.photoRequired ? xPhoto(id) : '');

  } else if (t.type === 'rating') {
    ctrl = '<div class="star-rating" id="st_'+id+'">' +
      [1,2,3,4,5].map(function(n){ return '<span class="star" id="s_'+id+'_'+n+'">&#9733;</span>'; }).join('') +
    '</div>' +
    '<div id="r_'+id+'" style="display:none"><textarea class="remarks-input" id="rem_'+id+'" placeholder="Remarks..."></textarea></div>' +
    (t.photoRequired ? xPhoto(id) : '');

  } else if (t.type === 'photo') {
    ctrl = '<div style="margin-top:10px">' +
      '<input type="file" accept="image/*" capture="environment" id="f_'+id+'" style="display:none"/>' +
      '<div class="photo-area" id="pa_'+id+'"><button class="photo-btn" id="pb_'+id+'">&#128247; Take / Upload Photo</button></div>' +
      '<div class="photo-preview" id="pp_'+id+'"><img id="pi_'+id+'" class="preview-img" alt=""/><button class="retake-btn" id="rt_'+id+'">&#8634; Retake</button></div>' +
      '<textarea class="remarks-input" id="rem_'+id+'" placeholder="Photo remarks..."></textarea>' +
    '</div>';

  } else if (t.type === 'text') {
    ctrl = '<textarea class="text-input" id="tx_'+id+'" placeholder="Enter your response..." style="margin-top:10px"></textarea>' +
      (t.photoRequired ? xPhoto(id) : '');
  }

  return '<div class="point-card" id="pc_'+id+'"><div class="point-label">'+esc(t.taskName)+' '+mb+pb+'</div>'+ctrl+'</div>';
}

function xPhoto(tid) {
  var xid = tid + 'x';
  return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">' +
    '<div style="font-size:11px;font-weight:600;color:var(--orange);margin-bottom:6px">&#128247; Photo required</div>' +
    '<input type="file" accept="image/*" capture="environment" id="f_'+xid+'" style="display:none"/>' +
    '<div class="photo-area" id="pa_'+xid+'" style="padding:10px"><button class="photo-btn" id="pb_'+xid+'" style="padding:7px 14px;font-size:12px">Take Photo</button></div>' +
    '<div class="photo-preview" id="pp_'+xid+'"><img id="pi_'+xid+'" class="preview-img" style="max-height:120px" alt=""/><button class="retake-btn" id="rt_'+xid+'">&#8634; Retake</button></div>' +
  '</div>';
}

function attachTaskListeners(t) {
  var id = t.taskId;

  if (t.type === 'yesno') {
    var yBtn = document.getElementById('y_'+id);
    var nBtn = document.getElementById('n_'+id);
    if (yBtn) yBtn.addEventListener('click', function() { setYN(id, 'yes'); });
    if (nBtn) nBtn.addEventListener('click', function() { setYN(id, 'no');  });
    var rem = document.getElementById('rem_'+id);
    if (rem) rem.addEventListener('input', function() { setRem(id, this.value); });

  } else if (t.type === 'rating') {
    [1,2,3,4,5].forEach(function(n) {
      var s = document.getElementById('s_'+id+'_'+n);
      if (s) s.addEventListener('click', function() { setRating(id, n); });
    });
    var rem = document.getElementById('rem_'+id);
    if (rem) rem.addEventListener('input', function() { setRem(id, this.value); });

  } else if (t.type === 'photo') {
    var pb = document.getElementById('pb_'+id);
    var fi = document.getElementById('f_'+id);
    var rt = document.getElementById('rt_'+id);
    if (pb && fi) pb.addEventListener('click', function() { fi.click(); });
    if (fi) fi.addEventListener('change', function() { handlePhoto(id, this); });
    if (rt) rt.addEventListener('click', function() { retakePhoto(id); });
    var rem = document.getElementById('rem_'+id);
    if (rem) rem.addEventListener('input', function() { setRem(id, this.value); });

  } else if (t.type === 'text') {
    var tx = document.getElementById('tx_'+id);
    if (tx) tx.addEventListener('input', function() { setText(id, this.value); });
  }

  // Photo required extra (for non-photo type tasks)
  if (t.photoRequired && t.type !== 'photo') {
    var xid = id + 'x';
    var xpb = document.getElementById('pb_'+xid);
    var xfi = document.getElementById('f_'+xid);
    var xrt = document.getElementById('rt_'+xid);
    if (xpb && xfi) xpb.addEventListener('click', function() { xfi.click(); });
    if (xfi) xfi.addEventListener('change', function() { handlePhotoExtra(id, this); });
    if (xrt) xrt.addEventListener('click', function() { retakePhotoExtra(id); });
  }
}

// ── SETTERS ────────────────────────────────────────────

function setYN(id, v) {
  if (!answers[id]) answers[id] = {};
  answers[id].val = v; answers[id].status = v === 'yes' ? 'OK' : 'FAIL';
  var card = document.getElementById('pc_'+id);
  card.classList.add('answered'); card.classList.toggle('failed', v === 'no');
  document.getElementById('y_'+id).classList.toggle('on', v === 'yes');
  document.getElementById('n_'+id).classList.toggle('on', v === 'no');
  var r = document.getElementById('r_'+id); if (r) r.style.display = v === 'no' ? 'block' : 'none';
  updateProgress();
}
function setRating(id, n) {
  if (!answers[id]) answers[id] = {};
  answers[id].val = String(n); answers[id].status = n >= 3 ? 'OK' : 'FAIL';
  [1,2,3,4,5].forEach(function(i) {
    var s = document.getElementById('s_'+id+'_'+i);
    if (s) s.classList.toggle('on', i <= n);
  });
  document.getElementById('pc_'+id).classList.add('answered');
  document.getElementById('pc_'+id).classList.toggle('failed', n < 3);
  var r = document.getElementById('r_'+id); if (r) r.style.display = 'block';
  updateProgress();
}
function setText(id, v) {
  if (!answers[id]) answers[id] = {};
  answers[id].val = v.trim(); answers[id].status = v.trim() ? 'OK' : 'FAIL';
  if (v.trim()) { document.getElementById('pc_'+id).classList.add('answered'); document.getElementById('pc_'+id).classList.remove('failed'); }
  else document.getElementById('pc_'+id).classList.remove('answered');
  updateProgress();
}
function setRem(id, v) {
  if (!answers[id]) answers[id] = {};
  answers[id].rem = v;
}
function handlePhoto(id, input) {
  if (!input.files || !input.files[0]) return;
  compress(input.files[0]).then(function(b64) {
    if (!answers[id]) answers[id] = {};
    answers[id].val = 'Photo taken'; answers[id].status = 'OK'; answers[id].photo = b64;
    document.getElementById('pc_'+id).classList.add('answered');
    document.getElementById('pa_'+id).style.display = 'none';
    document.getElementById('pi_'+id).src = b64;
    document.getElementById('pp_'+id).style.display = 'flex';
    updateProgress();
  });
}
function retakePhoto(id) {
  if (answers[id]) { delete answers[id].val; delete answers[id].photo; }
  document.getElementById('pc_'+id).classList.remove('answered');
  document.getElementById('pa_'+id).style.display = '';
  document.getElementById('pp_'+id).style.display = 'none';
  document.getElementById('f_'+id).value = '';
  updateProgress();
}
function handlePhotoExtra(id, input) {
  if (!input.files || !input.files[0]) return;
  var xid = id + 'x';
  compress(input.files[0]).then(function(b64) {
    if (!answers[id]) answers[id] = {};
    answers[id].photo = b64;
    document.getElementById('pa_'+xid).style.display = 'none';
    document.getElementById('pi_'+xid).src = b64;
    document.getElementById('pp_'+xid).style.display = 'flex';
    updateProgress();
  });
}
function retakePhotoExtra(id) {
  var xid = id + 'x';
  if (answers[id]) delete answers[id].photo;
  document.getElementById('pa_'+xid).style.display = '';
  document.getElementById('pp_'+xid).style.display = 'none';
  document.getElementById('f_'+xid).value = '';
  updateProgress();
}

// ── PROGRESS ───────────────────────────────────────────

function updateProgress() {
  var done = Object.keys(answers).filter(function(k){ return k !== '__wrong__'; }).length;
  document.getElementById('progCount').textContent = done + ' / ' + totalTasks;
  var pct = totalTasks > 0 ? (done / totalTasks) * 100 : 0;
  var fill = document.getElementById('progFill');
  fill.style.width = pct + '%'; fill.classList.toggle('done', pct >= 100);
  var allM = mandatoryIds.every(function(id){ return answers[id] && answers[id].val; });
  var allP = photoIds.every(function(id){ return answers[id] && answers[id].photo; });
  document.getElementById('submitBtn').disabled = !(allM && allP);
  var missing = [];
  mandatoryIds.filter(function(id){ return !answers[id]||!answers[id].val; }).forEach(function(id){
    if (id === '__wrong__') { missing.push('"What went wrong today?"'); return; }
    sections.forEach(function(s){ s.tasks.forEach(function(t){ if(t.taskId===id) missing.push(t.taskName.substring(0,28)+'...'); }); });
  });
  var el = document.getElementById('valMsg');
  if (missing.length > 0 && done > 0) {
    el.textContent = 'Pending: ' + missing.slice(0,2).join(', ') + (missing.length>2?' +'+(missing.length-2)+' more':'');
    el.style.display = 'block';
  } else { el.style.display = 'none'; }
}

// ── SUBMIT ─────────────────────────────────────────────

function submitChecklist() {
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';
  var entries = [];
  sections.forEach(function(sec){
    sec.tasks.forEach(function(t){
      var a = answers[t.taskId] || {};
      entries.push({
        section:t.section||sec.section, taskId:t.taskId, taskName:t.taskName, type:t.type,
        response:a.val||'', photoBase64:a.photo||'', photoUrl:'',
        status:a.status||(a.val?'OK':'MISS'), remarks:a.rem||''
      });
    });
  });
  // Fix: attach section to each entry
  sections.forEach(function(sec){
    sec.tasks.forEach(function(t){
      entries.forEach(function(e){ if(e.taskId===t.taskId) e.section=sec.section; });
    });
  });
  entries.push({
    section:'Daily Report', taskId:'__wrongToday__', taskName:'What went wrong today?', type:'text',
    response:(document.getElementById('wrongInput').value||'').trim(),
    photoBase64:'', photoUrl:'', status:'OK', remarks:''
  });
  postAPI({ action:'submitChecklist', staffName:user.name, role:user.role, entries:entries })
  .then(function(res){
    if (res.ok) {
      var dt = istDate();
      document.getElementById('sucMsg').textContent  = user.name + ' — ' + user.role + ' checklist submitted.';
      document.getElementById('sucTime').textContent = dt.label + ' at ' + dt.time + ' IST';
      showScreen('successScreen');
    } else {
      toast(res.error || 'Submission failed.', 'error');
      btn.disabled = false; btn.textContent = 'Submit Checklist';
    }
  });
}

// ── LOGOUT ─────────────────────────────────────────────

function logout() {
  pin=''; user=null; answers={}; sections=[];
  fillDots();
  document.getElementById('pinError').textContent = '';
  document.getElementById('clBody').innerHTML = '';
  document.getElementById('progFill').style.width = '0%';
  document.getElementById('progCount').textContent = '0 / 0';
  var wi = document.getElementById('wrongInput'); if (wi) wi.value = '';
  showScreen('pinScreen');
}
</script>
