<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Admin Panel — BSC Store Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#1E2D5A;--navy-l:#EEF1FB;--gold:#B8860B;--gold-l:#FFF8E7;--crimson:#C0392B;--crimson-l:#FFECEC;--green:#1E7A1E;--green-l:#D1FAE5;--orange:#D97706;--orange-l:#FEF3C7;--ink:#1A1A2E;--ink-60:rgba(26,26,46,.6);--ink-10:rgba(26,26,46,.06);--ivory:#F9F7F0;--white:#fff;--border:#E8E4D8;--r:12px;--r-sm:8px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ivory);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;outline:0;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit;outline:0}
/* PASSWORD MODAL */
.pw-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.pw-modal{background:var(--white);border-radius:var(--r);padding:24px;width:100%;max-width:320px}
.pw-modal h3{font-family:"DM Serif Display",serif;font-size:18px;color:var(--navy);margin-bottom:6px}
.pw-modal p{font-size:13px;color:var(--ink-60);margin-bottom:16px}
.pw-inp{width:100%;padding:12px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:16px;text-align:center;letter-spacing:.2em;color:var(--navy);font-weight:700;background:var(--ivory);-webkit-text-security:disc;margin-bottom:6px}
.pw-msg{font-size:12px;color:var(--crimson);min-height:18px;margin-bottom:10px}
.pw-btns{display:flex;gap:10px}
.pw-cancel{flex:1;padding:12px;border-radius:var(--r-sm);background:var(--ivory);color:var(--ink-60);font-size:13px;font-weight:600;border:1.5px solid var(--border)}
.pw-confirm{flex:2;padding:12px;border-radius:var(--r-sm);background:var(--navy);color:#fff;font-size:13px;font-weight:700}
/* TOPBAR */
.topbar{background:var(--navy);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-logo{height:34px;width:44px;object-fit:contain;background:rgba(255,255,255,.1);border-radius:7px;padding:3px}
.tb-title{font-family:"DM Serif Display",serif;color:#fff;font-size:15px}
.tb-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px}
.back-btn{padding:7px 14px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600}
/* TABS */
.tabs{background:var(--white);border-bottom:2px solid var(--border);display:flex;position:sticky;top:60px;z-index:90}
.tab{flex:1;padding:12px 6px;font-size:12px;font-weight:600;color:var(--ink-60);border-bottom:2px solid transparent;margin-bottom:-2px;background:transparent;border-top:0;border-left:0;border-right:0;border-radius:0;transition:color .15s,border-color .15s;text-align:center}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.panel{display:none;padding:16px;max-width:900px;margin:0 auto;padding-bottom:40px}
.panel.active{display:block}
/* SECTION */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;margin-top:4px}
.sec-hdr h2{font-family:"DM Serif Display",serif;font-size:18px;color:var(--navy)}
.add-btn{padding:9px 16px;border-radius:var(--r-sm);background:var(--navy);color:#fff;font-size:12px;font-weight:700}
/* FILTER */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-inp{flex:1;min-width:160px;padding:9px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:13px;background:var(--white);color:var(--ink)}
.filter-sel{padding:9px 10px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:12px;background:var(--white);color:var(--ink)}
/* TASK TABLE */
.task-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:var(--r);overflow:hidden;border:1.5px solid var(--border)}
.task-table th{background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:10px 12px;text-align:left;letter-spacing:.05em}
.task-table td{padding:10px 12px;font-size:12px;color:var(--ink);border-bottom:1px solid var(--border);vertical-align:middle}
.task-table tr:last-child td{border-bottom:0}
.task-table tr:hover td{background:var(--ivory)}
.tid{font-size:10px;font-weight:700;color:var(--ink-60);font-family:monospace}
.type-pill{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;background:var(--gold-l);color:var(--gold)}
.inactive-row td{opacity:.45}
.active-toggle{width:36px;height:20px;border-radius:10px;border:0;cursor:pointer;position:relative;transition:background .2s}
.active-toggle.on{background:var(--green)}
.active-toggle.off{background:var(--ink-60)}
.active-toggle::after{content:'';position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.active-toggle.on::after{left:18px}
.active-toggle.off::after{left:2px}
.action-btns{display:flex;gap:6px}
.edit-btn{padding:5px 11px;border-radius:6px;background:var(--navy-l);color:var(--navy);font-size:11px;font-weight:600}
.del-btn{padding:5px 11px;border-radius:6px;background:var(--crimson-l);color:var(--crimson);font-size:11px;font-weight:600}
/* USERS */
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.user-card{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);padding:14px;display:flex;align-items:center;gap:12px}
.u-avatar{width:42px;height:42px;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-size:14px;font-weight:700;color:var(--ink)}
.u-status{font-size:10px;margin-top:3px}
.u-actions{display:flex;flex-direction:column;gap:5px}
/* SETTINGS */
.settings-grid{display:grid;gap:14px}
.setting-card{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);padding:16px}
.setting-card h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:12px}
.setting-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.setting-row label{font-size:11px;font-weight:600;color:var(--ink-60);text-transform:uppercase;letter-spacing:.06em}
.setting-row input{padding:9px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:13px;color:var(--ink);background:var(--ivory)}
.save-settings-btn{padding:11px 22px;border-radius:var(--r-sm);background:var(--navy);color:#fff;font-size:13px;font-weight:700;margin-top:4px}
/* DRAWER */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none}
.overlay.open{display:block}
.drawer{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:92vh;overflow-y:auto;padding:20px 18px 32px}
.drawer.open{transform:translateY(0)}
.drawer-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}
.drawer-title{font-family:"DM Serif Display",serif;font-size:18px;color:var(--navy);margin-bottom:16px}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.form-row label{font-size:11px;font-weight:600;color:var(--ink-60);text-transform:uppercase;letter-spacing:.06em}
.form-row input,.form-row select,.form-row textarea{padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:13px;color:var(--ink);background:var(--ivory);width:100%}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drawer-btns{display:flex;gap:10px;margin-top:16px}
.drawer-cancel{flex:1;padding:13px;border-radius:var(--r);background:var(--ivory);color:var(--ink-60);font-size:14px;font-weight:600;border:1.5px solid var(--border)}
.drawer-save{flex:2;padding:13px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:14px;font-weight:700}
/* LOADING */
#pg-load{position:fixed;inset:0;background:var(--ivory);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#pg-load.hide{display:none}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--navy);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:9999;transition:transform .3s,opacity .3s;white-space:nowrap;pointer-events:none;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{background:var(--crimson)}
#toast.ok{background:var(--green)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-60);font-size:13px}
@media(max-width:600px){.task-table{display:block;overflow-x:auto}.form-2col{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- PASSWORD MODAL -->
<div class="pw-overlay" id="pwOverlay">
  <div class="pw-modal">
    <h3>🔒 Admin Access</h3>
    <p>Enter the admin password to continue.</p>
    <input class="pw-inp" type="password" id="pwInp" placeholder="••••••••" maxlength="20" onkeydown="if(event.key==='Enter')checkPw()"/>
    <div class="pw-msg" id="pwMsg"></div>
    <div class="pw-btns">
      <button class="pw-cancel" onclick="location.href='dashboard.html'">Cancel</button>
      <button class="pw-confirm" onclick="checkPw()">Confirm</button>
    </div>
  </div>
</div>

<div id="pg-load"><div class="spinner"></div><div style="font-size:13px;color:var(--ink-60)">Loading...</div></div>

<div class="topbar">
  <div class="tb-left">
    <img class="tb-logo" src="https://bsctextilescandb-ui.github.io/retail-crm/logo.jpg" alt="BSC"/>
    <div><div class="tb-title">Admin Panel</div><div class="tb-sub" id="tb-user">—</div></div>
  </div>
  <div><button class="back-btn" onclick="location.href='dashboard.html'">&#8592; Dashboard</button></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('tasks')">&#9776; Tasks</button>
  <button class="tab" onclick="switchTab('users')">&#128100; Users</button>
  <button class="tab" onclick="switchTab('settings')">&#9881; Settings</button>
</div>

<div class="panel active" id="panel-tasks">
  <div class="sec-hdr"><h2>Checklist Tasks</h2><button class="add-btn" onclick="openTaskDrawer()">&#43; Add Task</button></div>
  <div class="filter-bar">
    <input class="search-inp" id="taskSearch" placeholder="&#128269; Search tasks..." oninput="renderTasks()"/>
    <select class="filter-sel" id="secFilter" onchange="renderTasks()"><option value="">All Sections</option></select>
    <select class="filter-sel" id="statusFilter" onchange="renderTasks()"><option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
  </div>
  <div style="overflow-x:auto">
    <table class="task-table" id="taskTable">
      <thead><tr><th>ID</th><th>Section</th><th>Task</th><th>Type</th><th>Mand.</th><th>Active</th><th>Actions</th></tr></thead>
      <tbody id="taskBody"></tbody>
    </table>
  </div>
  <div class="empty" id="taskEmpty" style="display:none">No tasks found.</div>
</div>

<div class="panel" id="panel-users">
  <div class="sec-hdr"><h2>Users</h2><button class="add-btn" onclick="openUserDrawer()">&#43; Add User</button></div>
  <div class="user-grid" id="userGrid"></div>
</div>

<div class="panel" id="panel-settings">
  <div class="sec-hdr"><h2>Settings</h2></div>
  <div class="settings-grid">
    <div class="setting-card">
      <h3>&#127981; Store Information</h3>
      <div class="setting-row"><label>Store Name</label><input id="s-storeName" type="text"/></div>
      <div class="setting-row"><label>Location</label><input id="s-location" type="text"/></div>
      <div class="form-2col">
        <div class="setting-row"><label>Opening Time</label><input id="s-openTime" type="time"/></div>
        <div class="setting-row"><label>Closing Time</label><input id="s-closeTime" type="time"/></div>
      </div>
      <button class="save-settings-btn" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>
</div>

<!-- TASK DRAWER -->
<div class="overlay" id="taskOverlay" onclick="closeTaskDrawer()"></div>
<div class="drawer" id="taskDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title" id="drawerTitle">Add Task</div>
  <input type="hidden" id="editTaskId"/>
  <div class="form-row"><label>Section</label>
    <select id="f-section" onchange="checkNewSec()">
      <option value="">— Select —</option><option value="__new__">+ New section...</option>
    </select>
  </div>
  <div class="form-row" id="newSecRow" style="display:none"><label>New Section Name</label><input id="f-newSection" type="text" placeholder="e.g. Mid-Day Checks"/></div>
  <div class="form-row"><label>Task Name</label><input id="f-taskName" type="text" placeholder="Describe the task..."/></div>
  <div class="form-2col">
    <div class="form-row"><label>Type</label>
      <select id="f-type"><option value="yesno">Yes / No</option><option value="rating">Rating (1–5)</option><option value="photo">Photo</option><option value="text">Text</option></select>
    </div>
    <div class="form-row"><label>Mandatory</label>
      <select id="f-mandatory"><option value="Yes">Yes</option><option value="No">No</option></select>
    </div>
  </div>
  <div class="form-2col">
    <div class="form-row"><label>Photo Required</label>
      <select id="f-photo"><option value="No">No</option><option value="Yes">Yes</option></select>
    </div>
    <div class="form-row"><label>Active</label>
      <select id="f-active"><option value="Yes">Yes</option><option value="No">No</option></select>
    </div>
  </div>
  <div class="drawer-btns">
    <button class="drawer-cancel" onclick="closeTaskDrawer()">Cancel</button>
    <button class="drawer-save" onclick="saveTask()">&#10003; Save Task</button>
  </div>
</div>

<!-- USER DRAWER -->
<div class="overlay" id="userOverlay" onclick="closeUserDrawer()"></div>
<div class="drawer" id="userDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title" id="userDrawerTitle">Add User</div>
  <input type="hidden" id="editUserName"/>
  <div class="form-row"><label>Full Name</label><input id="u-name" type="text" placeholder="e.g. Amjad"/></div>
  <div class="form-row"><label>PIN (4 digits)</label><input id="u-pin" type="number" placeholder="e.g. 1234" maxlength="4" min="1000" max="9999"/></div>
  <div class="form-row"><label>Status</label><select id="u-active"><option value="Yes">Active</option><option value="No">Inactive</option></select></div>
  <div class="drawer-btns">
    <button class="drawer-cancel" onclick="closeUserDrawer()">Cancel</button>
    <button class="drawer-save" onclick="saveUser()">&#10003; Save User</button>
  </div>
</div>

<div id="toast"></div>

<script>
var API='https://bsc-checklist.bsctextiles-candb.workers.dev';
var ADMIN_PW='BSCCANDB';
var me=null,allTasks=[],allUsers=[],settings={};
var adminPassword='';

// Check session
(function(){
  var raw=sessionStorage.getItem('bscAuth');
  if(!raw){location.href='index.html';return;}
  try{me=JSON.parse(raw);document.getElementById('tb-user').textContent=me.name;}
  catch(e){location.href='index.html';}
  // Show password modal
  document.getElementById('pg-load').classList.add('hide');
  setTimeout(function(){document.getElementById('pwInp').focus();},200);
})();

function checkPw(){
  var val=document.getElementById('pwInp').value.trim();
  if(val!==ADMIN_PW){document.getElementById('pwMsg').textContent='Incorrect password.';return;}
  adminPassword=val;
  document.getElementById('pwOverlay').style.display='none';
  document.getElementById('pg-load').classList.remove('hide');
  loadAll();
}

function apiGet(action,params,cb){
  var q='?action='+encodeURIComponent(action);
  if(params)Object.keys(params).forEach(function(k){q+='&'+encodeURIComponent(k)+'='+encodeURIComponent(String(params[k]));});
  fetch(API+'/'+q,{redirect:'follow'}).then(function(r){return r.json();}).then(cb).catch(function(e){cb({ok:false,error:e.message});});
}
function apiPost(data,cb){
  fetch(API+'/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),redirect:'follow'})
    .then(function(r){return r.json();}).then(cb).catch(function(e){cb({ok:false,error:e.message});});
}
function toast(msg,type){
  var t=document.getElementById('toast');t.textContent=msg;
  t.className=(type==='err'?'err show':type==='ok'?'ok show':'show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.className='';},3000);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setVal(id,val){var el=document.getElementById(id);if(!el)return;if(el.tagName==='SELECT'){for(var i=0;i<el.options.length;i++){if(el.options[i].value===val){el.selectedIndex=i;return;}}}else el.value=val;}

function switchTab(tab){
  ['tasks','users','settings'].forEach(function(t){
    document.querySelector('[onclick*="\''+t+'\'"]').classList.toggle('active',t===tab);
    document.getElementById('panel-'+t).classList.toggle('active',t===tab);
  });
}

function loadAll(){
  var done=0;
  function check(){if(++done===3){document.getElementById('pg-load').classList.add('hide');}}
  apiGet('getTasks',{},function(r){if(r.ok){allTasks=r.tasks||[];populateFilters();renderTasks();}check();});
  apiGet('getUsers',{},function(r){if(r.ok){allUsers=r.users||[];renderUsers();}check();});
  apiGet('getSettings',{},function(r){if(r.ok){settings=r.settings||{};populateSettings();}check();});
}

function populateFilters(){
  var secs=[...new Set(allTasks.map(function(t){return String(t.Section||'').trim();}))].filter(Boolean);
  var sf=document.getElementById('secFilter');sf.innerHTML='<option value="">All Sections</option>';
  secs.forEach(function(s){sf.innerHTML+='<option value="'+esc(s)+'">'+esc(s)+'</option>';});
  var fd=document.getElementById('f-section');
  fd.innerHTML='<option value="">— Select —</option>';
  secs.forEach(function(s){fd.innerHTML+='<option value="'+esc(s)+'">'+esc(s)+'</option>';});
  fd.innerHTML+='<option value="__new__">+ New section...</option>';
}

function renderTasks(){
  var q=(document.getElementById('taskSearch').value||'').toLowerCase();
  var sf=document.getElementById('secFilter').value;
  var stf=document.getElementById('statusFilter').value;
  var filtered=allTasks.filter(function(t){
    if(sf&&String(t.Section||'').trim()!==sf)return false;
    if(stf==='active'&&String(t.Active||'').toLowerCase()!=='yes')return false;
    if(stf==='inactive'&&String(t.Active||'').toLowerCase()==='yes')return false;
    if(q){var hay=(String(t.Task_ID||'')+String(t.Task_Name||'')+String(t.Section||'')).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  var tbody=document.getElementById('taskBody');tbody.innerHTML='';
  document.getElementById('taskEmpty').style.display=filtered.length?'none':'block';
  document.getElementById('taskTable').style.display=filtered.length?'':'none';
  filtered.forEach(function(t){
    var isActive=String(t.Active||'').toLowerCase()==='yes';
    var tr=document.createElement('tr');tr.className=isActive?'':'inactive-row';
    tr.innerHTML='<td><span class="tid">'+esc(t.Task_ID||'')+'</span></td>'
      +'<td style="max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.Section||'')+'</td>'
      +'<td style="max-width:220px">'+esc(t.Task_Name||'')+'</td>'
      +'<td><span class="type-pill">'+esc(t.Type||'')+'</span></td>'
      +'<td style="text-align:center">'+(String(t.Mandatory||'').toLowerCase()==='yes'?'&#10003;':'-')+'</td>'
      +'<td><button class="active-toggle '+(isActive?'on':'off')+'" onclick="toggleTask(\''+esc(String(t.Task_ID||''))+'\')"></button></td>'
      +'<td><div class="action-btns">'
        +'<button class="edit-btn" onclick="openTaskDrawer(\''+esc(String(t.Task_ID||''))+'\')">Edit</button>'
        +'<button class="del-btn" onclick="deleteTask(\''+esc(String(t.Task_ID||''))+'\')">Delete</button>'
      +'</div></td>';
    tbody.appendChild(tr);
  });
}

function openTaskDrawer(taskId){
  document.getElementById('editTaskId').value=taskId||'';
  if(taskId){
    var t=allTasks.find(function(x){return String(x.Task_ID||'').trim()===taskId;});if(!t)return;
    document.getElementById('drawerTitle').textContent='Edit Task — '+taskId;
    setVal('f-section',String(t.Section||'').trim());
    setVal('f-taskName',String(t.Task_Name||'').trim());
    setVal('f-type',String(t.Type||'yesno').trim().toLowerCase());
    setVal('f-mandatory',String(t.Mandatory||'Yes').trim());
    setVal('f-photo',String(t.Photo_Required||'No').trim());
    setVal('f-active',String(t.Active||'Yes').trim());
  } else {
    document.getElementById('drawerTitle').textContent='Add New Task';
    ['f-taskName','f-newSection'].forEach(function(id){document.getElementById(id).value='';});
    setVal('f-section','');setVal('f-type','yesno');setVal('f-mandatory','Yes');setVal('f-photo','No');setVal('f-active','Yes');
    document.getElementById('newSecRow').style.display='none';
  }
  document.getElementById('taskOverlay').classList.add('open');
  document.getElementById('taskDrawer').classList.add('open');
}
function closeTaskDrawer(){document.getElementById('taskOverlay').classList.remove('open');document.getElementById('taskDrawer').classList.remove('open');}
function checkNewSec(){document.getElementById('newSecRow').style.display=document.getElementById('f-section').value==='__new__'?'block':'none';}

function saveTask(){
  var taskId=document.getElementById('editTaskId').value;
  var secVal=document.getElementById('f-section').value;
  var section=secVal==='__new__'?document.getElementById('f-newSection').value.trim():secVal;
  var taskName=document.getElementById('f-taskName').value.trim();
  if(!section||!taskName){toast('Section and Task Name are required','err');return;}
  var payload={section,taskName,type:document.getElementById('f-type').value,
    mandatory:document.getElementById('f-mandatory').value,
    photoRequired:document.getElementById('f-photo').value,
    active:document.getElementById('f-active').value,
    adminPassword:adminPassword};
  payload.action=taskId?'updateTask':'addTask';
  if(taskId)payload.taskId=taskId;
  closeTaskDrawer();
  apiPost(payload,function(r){
    if(r.ok){toast(taskId?'Task updated':'Task added ✓','ok');loadAll();}
    else toast(r.error||'Failed','err');
  });
}

function toggleTask(taskId){
  if(!confirm('Toggle active status for task '+taskId+'?'))return;
  apiPost({action:'toggleTask',taskId,adminPassword},function(r){
    if(r.ok){toast('Task '+(r.active==='Yes'?'activated':'deactivated'));loadAll();}
    else toast(r.error||'Failed','err');
  });
}

function deleteTask(taskId){
  if(!confirm('Delete task '+taskId+'?\nTasks with submission history cannot be deleted.'))return;
  apiPost({action:'deleteTask',taskId,adminPassword},function(r){
    if(r.ok){toast('Task deleted','ok');loadAll();}
    else toast(r.error||'Cannot delete: '+r.error,'err');
  });
}

function renderUsers(){
  var grid=document.getElementById('userGrid');grid.innerHTML='';
  allUsers.forEach(function(u){
    var isActive=String(u.active||'').toLowerCase()==='yes';
    var card=document.createElement('div');card.className='user-card';
    var init=(u.name||'?').slice(0,1).toUpperCase();
    card.innerHTML='<div class="u-avatar">'+esc(init)+'</div>'
      +'<div class="u-info"><div class="u-name">'+esc(u.name||'')+'</div>'
      +'<div class="u-status" style="color:'+(isActive?'var(--green)':'var(--crimson)')+'">'+( isActive?'● Active':'● Inactive')+'</div></div>'
      +'<div class="u-actions">'
        +'<button class="edit-btn" onclick="openUserDrawer(\''+esc(u.name||'')+'\')">Edit</button>'
        +'<button class="del-btn" onclick="toggleUserStatus(\''+esc(u.name||'')+'\',\''+(isActive?'No':'Yes')+'\')">'+( isActive?'Deactivate':'Activate')+'</button>'
      +'</div>';
    grid.appendChild(card);
  });
}

function openUserDrawer(userName){
  document.getElementById('editUserName').value=userName||'';
  if(userName){
    var u=allUsers.find(function(x){return x.name===userName;});if(!u)return;
    document.getElementById('userDrawerTitle').textContent='Edit User';
    document.getElementById('u-name').value=u.name||'';
    document.getElementById('u-name').disabled=true;
    document.getElementById('u-pin').value='';
    document.getElementById('u-pin').placeholder='Leave blank to keep current PIN';
    setVal('u-active',u.active||'Yes');
  } else {
    document.getElementById('userDrawerTitle').textContent='Add New User';
    document.getElementById('u-name').value='';document.getElementById('u-name').disabled=false;
    document.getElementById('u-pin').value='';document.getElementById('u-pin').placeholder='4-digit PIN';
    setVal('u-active','Yes');
  }
  document.getElementById('userOverlay').classList.add('open');
  document.getElementById('userDrawer').classList.add('open');
}
function closeUserDrawer(){document.getElementById('userOverlay').classList.remove('open');document.getElementById('userDrawer').classList.remove('open');}

function saveUser(){
  var isEdit=!!document.getElementById('editUserName').value;
  var name=document.getElementById('u-name').value.trim();
  var pin=document.getElementById('u-pin').value.trim();
  var active=document.getElementById('u-active').value;
  if(!name){toast('Name is required','err');return;}
  if(!isEdit&&(!pin||pin.length!==4||isNaN(pin))){toast('Valid 4-digit PIN required','err');return;}
  var payload=isEdit?{action:'updateUser',name,active,adminPassword}:{action:'addUser',name,pin,active,adminPassword};
  if(isEdit&&pin&&pin.length===4)payload.newPin=pin;
  closeUserDrawer();
  apiPost(payload,function(r){
    if(r.ok){toast(isEdit?'User updated':'User added ✓','ok');loadAll();}
    else toast(r.error||'Failed','err');
  });
}

function toggleUserStatus(name,active){
  if(!confirm((active==='Yes'?'Activate':'Deactivate')+' user "'+name+'"?'))return;
  apiPost({action:'updateUser',name,active,adminPassword},function(r){
    if(r.ok){toast('User '+(active==='Yes'?'activated':'deactivated'),'ok');loadAll();}
    else toast(r.error||'Failed','err');
  });
}

function populateSettings(){
  var map={Store_Name:'s-storeName',Store_Location:'s-location',Opening_Time:'s-openTime',Closing_Time:'s-closeTime'};
  Object.keys(map).forEach(function(k){var el=document.getElementById(map[k]);if(el&&settings[k])el.value=settings[k];});
}
function saveSettings(){
  var s={Store_Name:document.getElementById('s-storeName').value.trim(),
         Store_Location:document.getElementById('s-location').value.trim(),
         Opening_Time:document.getElementById('s-openTime').value,
         Closing_Time:document.getElementById('s-closeTime').value};
  apiPost({action:'updateSettings',settings:s,adminPassword},function(r){
    if(r.ok)toast('Settings saved ✓','ok');else toast(r.error||'Failed','err');
  });
}
</script>
</body>
</html>
